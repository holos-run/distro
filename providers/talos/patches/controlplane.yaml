# Applied to control plane nodes only. These documents describe cluster-wide
# components that exist only in the control plane's machine config.
#
# No CNI and no kube-proxy: Cilium replaces both, so nodes stay NotReady
# until it is installed, the control plane included, as upstream Talos runs
# its CNI there. This is the Talos 1.14 form: delete the Flannel document,
# disable kube-proxy.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Kubernetes 1.37 serves PodCertificateRequest and ClusterTrustBundle as
# certificates.k8s.io/v1 by default. Substrate's pod certificate controller
# and kagent's chart still ask for v1beta1, so serve it as well.
#
# The control plane runs a Cilium agent like every node, so the API server, a
# host-network static pod, reaches Services in the VXLAN overlay.
# Aggregator routing makes it dial a Service's endpoints rather than its
# ClusterIP, as GKE and EKS do, so a Service that works only by ClusterIP
# fails here first (ADR 0003).
#
# Admission webhooks still name a URL on the ingress Gateway's LoadBalancer
# address, which the control plane reaches on the LAN (the host entries are in
# clusters/<cluster>/controlplane.yaml). An APIService can only name a
# Service, so aggregator routing makes the API server dial the Service's
# endpoints instead of its ClusterIP; a selectorless Service whose
# EndpointSlice names the Gateway's address then works.
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  runtime-config: certificates.k8s.io/v1beta1=true
  enable-aggregator-routing: "true"
---
# Talos does not deploy CoreDNS. The platform's coredns component
# (holos/components/coredns) deploys it instead, because the Corefile is
# platform policy (the site's private zone is forwarded to the site's
# resolvers) and Talos offers no way to set it: KubeCoreDNSConfig has only
# enabled and image, and talosctl upgrade-k8s re-applies Talos's own
# Corefile. Switching an existing cluster over is in holos/README.md.
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
