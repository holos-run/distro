# local-path-provisioner for the spike's two PVCs (the dev PostgreSQL and the
# bundled RustFS). Talos mounts /var read-write, /opt is read-only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
patches:
- target: {kind: Namespace, name: local-path-storage}
  patch: |-
    - op: add
      path: /metadata/labels
      value:
        pod-security.kubernetes.io/enforce: privileged
- target: {kind: ConfigMap, name: local-path-config}
  patch: |-
    - op: replace
      path: /data/config.json
      value: |-
        {"nodePathMap":[{"node":"DEFAULT_PATH_FOR_NON_LISTED_NODES","paths":["/var/local-path-provisioner"]}]}
- target: {kind: StorageClass, name: local-path}
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        storageclass.kubernetes.io/is-default-class: "true"
