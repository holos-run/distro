# Milestone step 7: an Istio Gateway whose parametersRef adds a podCertificate
# projected volume from Substrate's pod identity signer. Istio merges the
# ConfigMap's `deployment` key into the Deployment it generates (strategic
# merge). The ServiceAccount is named by the gateway.istio.io/service-account
# annotation, not by the ConfigMap.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spike-gateway-options
  namespace: istio-ingress
data:
  deployment: |
    spec:
      template:
        spec:
          containers:
          - name: istio-proxy
            volumeMounts:
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
          volumes:
          - name: podidentity
            projected:
              sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  keyPath: key.pem
                  certificateChainPath: chain.pem
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spike
  namespace: istio-ingress
  annotations:
    gateway.istio.io/service-account: spike-gateway
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: spike-gateway-options
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
