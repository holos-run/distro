# Milestone step 6: two pods in an ambient namespace; a request between them
# shows in ztunnel's access log.
apiVersion: v1
kind: Namespace
metadata:
  name: ambient-test
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whoami
  namespace: ambient-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: ambient-test
spec:
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      serviceAccountName: whoami
      containers:
      - name: whoami
        image: docker.io/traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: ambient-test
spec:
  selector: {app: whoami}
  ports:
  - name: http
    port: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: ambient-test
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ambient-test
spec:
  serviceAccountName: client
  containers:
  - name: curl
    image: docker.io/curlimages/curl:8.11.1
    command: [sleep, "86400"]
