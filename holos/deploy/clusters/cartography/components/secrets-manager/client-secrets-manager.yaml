apiVersion: keycloak.holos.run/v1alpha1
kind: Client
metadata:
    name: secrets-manager
    namespace: secrets-manager
spec:
    clientId: secrets-manager
    description: Bank of the Salish Sea Secrets Manager
    instanceRef:
        name: default
        namespace: keycloak
    redirectUris:
        - https://secrets.cartography.bank.internal/pkce/verify
    type: public
    webOrigins:
        - https://secrets.cartography.bank.internal
