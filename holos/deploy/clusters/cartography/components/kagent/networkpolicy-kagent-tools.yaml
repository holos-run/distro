apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-tools
  namespace: kagent
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
          app.kubernetes.io/instance: kagent
          app.kubernetes.io/name: kagent
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ate-system
      podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - port: 8084
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent-tools
  policyTypes:
  - Ingress
