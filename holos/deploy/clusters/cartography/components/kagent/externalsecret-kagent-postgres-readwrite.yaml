apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-readwrite
  namespace: kagent
spec:
  data:
  - remoteRef:
      key: kagent-db-users
      property: kagent_readwrite_user
    secretKey: readwrite
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kagent-db-users
  target:
    creationPolicy: Owner
    template:
      data:
        readWriteConnectionString: postgresql://kagent_readwrite_user:{{ .readwrite
          }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=verify-full&sslrootcert=/etc/private-ca/ca.crt
      engineVersion: v2
      mergePolicy: Replace
