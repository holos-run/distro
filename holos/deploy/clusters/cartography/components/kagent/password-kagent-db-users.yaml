apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: kagent-db-users
  namespace: ate-system
spec:
  allowRepeat: true
  length: 32
  noUpper: false
  secretKeys:
