apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent-tools
    app.kubernetes.io/version: 0.3.0
    helm.sh/chart: kagent-tools-0.3.0
  name: kagent-tools
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent-tools
    spec:
      affinity: null
      containers:
      - args:
        - --port
        - "8084"
        - --metrics-port
        - "8085"
        - --read-only
        command:
        - /tool-server
        env:
        - name: KAGENT_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: kagent-tools-openai
              optional: true
        - name: OTEL_TRACING_ENABLED
          value: "false"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://host.docker.internal:4317
        - name: OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
          value: "15"
        - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
          value: "true"
        - name: TOKEN_PASSTHROUGH
          value: "false"
        - name: PROMETHEUS_URL
          value: prometheus.kagent.svc.cluster.local:9090
        - name: PROMETHEUS_USERNAME
          value: ""
        - name: PROMETHEUS_PASSWORD
          value: ""
        - name: GRAFANA_URL
          value: http://grafana.kagent.svc.cluster.local:3000
        - name: GRAFANA_API_KEY
          value: ""
        image: ghcr.io/kagent-dev/kagent/tools:0.3.0@sha256:cb89eb76216195a90cac73846b447525b6e6e33e45154d1ded9621bf11340315
        imagePullPolicy: IfNotPresent
        name: tools
        ports:
        - containerPort: 8084
          name: http-tools
          protocol: TCP
        - containerPort: 8085
          name: http-metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http-tools
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kagent-tools
      volumes:
      - emptyDir: {}
        name: tmp
