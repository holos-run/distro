apiVersion: v1
data:
  controller.yaml: |
    database:
      owner:
        role: kagent_owner
        urlFile: /etc/kagent/secrets/database-owner-url
      readWrite:
        role: kagent_readwrite
        urlFile: /etc/kagent/secrets/database-readwrite-url
      schema: kagent
      skipMigrations: false
      vectorEnabled: false
      vectorSchema: extensions
    gateway:
      publicUrl: http://kagent-controller.kagent.svc.cluster.local:8083
    harnessImages:
      claude: ghcr.io/kagent-dev/kagent/claude-harness:1.0.0-rc3@sha256:216613bf155d3d437765675144fee19c9045cb21cd2e481189f2dcae36c24b3b
      codex: ghcr.io/kagent-dev/kagent/codex-harness:1.0.0-rc3@sha256:84c3275e36c0d98472a8b930a628e47e08277e7ce4438908e2a44fd1d8a9efd2
      kagent: ghcr.io/kagent-dev/kagent/golang-adk:1.0.0-rc3@sha256:51859027b42b704c8f443876ef5155ace2f411752f297e5cb43e04d9b91545b7
    kubernetes:
      namespace: kagent
      watchNamespaces:
      - kagent
    logging:
      level: info
    metrics:
      bindAddress: "0"
      secure: true
    push:
      allowHttp: false
      allowPrivateNetworks: false
      issuer: https://kagent.cartography.bank.internal
      maxConcurrency: 10
      recoveryInterval: 60s
      sendTimeout: 5s
    runtimeDefaults:
      builtinTools:
        bashVenvPath: ""
        disableAskUser: false
        disableBash: false
        disableFileSearch: false
      controlPlaneUrl: http://kagent-controller.kagent.svc.cluster.local:8083
      cpu: "1"
      gatewayUrl: http://kagent-controller.kagent.svc.cluster.local:8083
      logging:
        level: info
      memory: 1Gi
      telemetry: {}
    sandboxes:
      cpu: "1"
      defaultTtl: 3600s
      guestImage: ghcr.io/kagent-dev/kagent/sandbox-guest:1.0.0-rc3@sha256:8521d7e41097fb2964570ce1e65115056098d1c0c17c5dab1c2a4f30a7e06939
      maxTtl: 86400s
      memory: 1Gi
    server:
      auth:
        mode: trusted-proxy
        userIdClaim: email
      bindAddress: :8083
      grpcReflection: false
    sessions:
      idleTtl: 604800s
      shareMaxTtl: 0s
    substrate:
      actorJwtIssuer: https://idp.ate-system.svc
      apiEndpoint: dns:///api.ate-system.svc:443
      caFile: /run/substrate-servicedns/trust-bundle.pem
      clientCertFile: /run/substrate-podidentity/credential-bundle.pem
      routerUrl: https://atenet-router.ate-system.svc:443
    telemetry: {}
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.0.0-holos.20261107.3af6ae5
    helm.sh/chart: kagent-0.0.0-holos.20261107.3af6ae5
  name: kagent-controller
  namespace: kagent
