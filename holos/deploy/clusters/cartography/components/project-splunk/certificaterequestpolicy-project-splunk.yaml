apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
    labels:
        holos.run/project: splunk
    name: project-splunk
spec:
    allowed:
        dnsNames:
            required: true
            validations:
                - message: 'must be one of these exactly, * included: *.splunk.ate.cartography.bank.internal'
                  rule: self in ["*.splunk.ate.cartography.bank.internal"]
            values:
                - '*.splunk.ate.cartography.bank.internal'
        isCA: false
    selector:
        issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: private-ca
        namespace:
            matchNames:
                - substrate-shim
