apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
    labels:
        holos.run/project: splunk
    name: approver-policy:project-splunk
rules:
    - apiGroups:
        - policy.cert-manager.io
      resourceNames:
        - project-splunk
      resources:
        - certificaterequestpolicies
      verbs:
        - use
