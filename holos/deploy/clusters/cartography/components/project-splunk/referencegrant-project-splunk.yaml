apiVersion: security.holos.run/v1alpha1
kind: ReferenceGrant
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
    labels:
        holos.run/project: splunk
    name: project-splunk
    namespace: keycloak
spec:
    from:
        - group: keycloak.holos.run
          kind: Group
          namespace: splunk
        - group: keycloak.holos.run
          kind: User
          namespace: splunk
        - group: keycloak.holos.run
          kind: GroupMembership
          namespace: splunk
        - group: keycloak.holos.run
          kind: Client
          namespace: splunk
    to:
        - group: keycloak.holos.run
          kind: Instance
          name: default
