apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: splunk
    name: ate-splunk
    namespace: ate-system
spec:
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: project-splunk
          namespace: substrate-shim
          sectionName: splunk
    rules:
        - backendRefs:
            - name: atenet-router
              port: 443
