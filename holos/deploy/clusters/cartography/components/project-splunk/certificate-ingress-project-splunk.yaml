apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        holos.run/project: splunk
    name: ingress-project-splunk
    namespace: istio-ingress
spec:
    dnsNames:
        - '*.splunk.cartography.bank.internal'
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: private-ca
    privateKey:
        algorithm: ECDSA
        size: 256
    secretName: ingress-project-splunk-tls
