apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: seabank-controller-keycloak-creds
    namespace: seabank-controller
spec:
    dataFrom:
        - extract:
            key: svc-seabank-controller
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: keycloak
    target:
        creationPolicy: Owner
        name: seabank-controller-keycloak-creds
        template:
            data:
                clientId: '{{ .username }}'
                clientSecret: '{{ .password }}'
            engineVersion: v2
            mergePolicy: Replace
