apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    name: keycloak-db
    namespace: keycloak
spec:
    bootstrap:
        initdb:
            database: keycloak
            owner: keycloak
            secret:
                name: keycloak-db
    enablePDB: false
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
    instances: 1
    resources:
        limits:
            memory: 1Gi
        requests:
            cpu: 100m
            memory: 256Mi
    storage:
        size: 10Gi
