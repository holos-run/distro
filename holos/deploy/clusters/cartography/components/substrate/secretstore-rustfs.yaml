apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rustfs
  namespace: ate-system
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: ate-system-rustfs-reader
      remoteNamespace: rustfs
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
