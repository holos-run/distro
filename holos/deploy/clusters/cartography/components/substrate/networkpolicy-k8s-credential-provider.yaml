apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - port: 50051
      protocol: TCP
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
  - Ingress
