apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: substrate-db-users
  namespace: ate-system
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: ate-system-substrate-db-users-reader
      remoteNamespace: ate-system
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
