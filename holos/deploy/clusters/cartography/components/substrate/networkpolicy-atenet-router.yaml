apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  ingress:
  - ports:
    - port: https
      protocol: TCP
    - port: connect-tls
      protocol: TCP
  podSelector:
    matchLabels:
      app: atenet-router
  policyTypes:
  - Ingress
