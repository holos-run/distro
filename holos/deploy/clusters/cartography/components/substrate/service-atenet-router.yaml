apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8443
  - name: connect-tls
    port: 8444
    protocol: TCP
    targetPort: 8444
  selector:
    app: atenet-router
  type: ClusterIP
