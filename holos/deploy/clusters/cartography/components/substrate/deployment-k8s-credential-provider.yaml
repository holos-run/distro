apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: k8s-credential-provider
  name: k8s-credential-provider
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-credential-provider
  template:
    metadata:
      annotations:
        holos.run/config-hash: add669cc
      labels:
        app: k8s-credential-provider
    spec:
      containers:
      - args:
        - --listen-address=:50051
        - --metrics-address=:9090
        - --health-address=:9091
        - --status-address=127.0.0.1:4040
        - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --namespace-policy-file=/etc/k8s-credential-provider/namespace-policy.yaml
        - --log-level=info
        image: ghcr.io/holos-run/substrate/kubernetes-secrets@sha256:236d44b1c4eabe385df3d1cf9f83a6914e5b915c71b3c6d15120eaeb8953c9a5
        name: k8s-credential-provider
        ports:
        - containerPort: 50051
          name: grpc
        - containerPort: 9090
          name: metrics
        - containerPort: 9091
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/k8s-credential-provider
          name: namespace-policy
          readOnly: true
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: k8s-credential-provider
      volumes:
      - configMap:
          name: k8s-credential-provider-namespace-policy
        name: namespace-policy
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
