apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ate-api-server-secret-envvars
  namespace: ate-system
spec:
  data:
  - remoteRef:
      key: substrate-db-users
      property: substrate_owner_user
    secretKey: owner
  - remoteRef:
      key: substrate-db-users
      property: substrate_readwrite_user
    secretKey: readwrite
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: substrate-db-users
  target:
    creationPolicy: Owner
    template:
      data:
        ATE_API_POSTGRES_OWNER_CONNECTION_STRING: postgresql://substrate_owner_user:{{
          .owner }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=verify-full&sslrootcert=/run/postgres-server-ca/server-ca.pem
        ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING: postgresql://substrate_readwrite_user:{{
          .readwrite }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=verify-full&sslrootcert=/run/postgres-server-ca/server-ca.pem
        ATE_API_POSTGRES_SCHEMA: substrate
      engineVersion: v2
      mergePolicy: Replace
