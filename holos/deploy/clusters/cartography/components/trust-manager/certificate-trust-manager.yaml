# Source: trust-manager/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trust-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/instance: trust-manager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trust-manager
    app.kubernetes.io/version: v0.26.0
    helm.sh/chart: trust-manager-v0.26.0
spec:
  commonName: "trust-manager.cert-manager.svc"
  dnsNames:
  - "trust-manager.cert-manager.svc"
  secretName: trust-manager-tls
  secretTemplate:
    annotations:
      cert-manager.io/allow-direct-injection: "true"
  privateKey:
    rotationPolicy: Always
  revisionHistoryLimit: 1
  issuerRef:
    name: trust-manager
    kind: Issuer
    group: cert-manager.io
