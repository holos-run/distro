apiVersion: authenticator.holos.run/v1alpha1
kind: Backend
metadata:
  name: kubernetes
  namespace: seabank-authenticator
spec:
  groupMapping:
    anyOf:
    - /platform/owners
  groupsHeaderSeparator: '|'
  host: k8s.cartography.bank.internal
  oidc:
    clientID: kubectl
    groupsClaim: groups
    issuerURL: https://keycloak.cartography.bank.internal/realms/default
    usernameClaim: preferred_username
    usernamePrefix: 'oidc:'
  server:
    url: https://kubernetes.default.svc
  serviceAccountRef:
    name: seabank-authenticator-impersonator
