apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s
  namespace: seabank-authenticator
spec:
  dnsNames:
  - k8s.cartography.bank.internal
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: private-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: k8s-tls
