apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
    labels:
        holos.run/project: splunk
    name: claude
    namespace: splunk
spec:
    claude: {}
    env:
        - name: PLANBOARD_USER
          value: splunk planning agent
        - name: GIT_AUTHOR_NAME
          value: splunk planning agent
        - name: GIT_AUTHOR_EMAIL
          value: planboard-agent@splunk.cartography.bank.internal
        - name: GIT_COMMITTER_NAME
          value: splunk planning agent
        - name: GIT_COMMITTER_EMAIL
          value: planboard-agent@splunk.cartography.bank.internal
        - name: REPO_URL
          value: https://github.com/holos-run/splunk-planning
        - name: REPO_REF
          value: main
        - name: PLANBOARD_ROOT
          value: /data/workspace/repo
    substrate:
        snapshotPolicy:
            location: s3://substrate/splunk/
        workerPoolRef:
            name: gvisor
    workload:
        image: quay.cartography.bank.internal/splunk/planboard-agent@sha256:b9d207e18537098c064364a1012c5a10a7dd3d7a219a152058ee0a20ad73a2c5
