apiVersion: batch/v1
kind: Job
metadata:
    annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    labels:
        app.kubernetes.io/name: atespace-setup
        holos.run/project: splunk
    name: planboard-splunk
    namespace: ate-system
spec:
    activeDeadlineSeconds: 300
    backoffLimit: 3
    template:
        metadata:
            labels:
                app.kubernetes.io/name: atespace-setup
                holos.run/project: splunk
        spec:
            automountServiceAccountToken: false
            containers:
                - command:
                    - /bin/sh
                    - -c
                    - |-
                      set -eu
                      ATE_TOKEN=$(cat /var/run/ate/api/token)
                      export ATE_TOKEN

                      rpc() {
                        grpcurl -cacert /var/run/ate/api/ca.pem -max-time 60 \
                          -expand-headers -H 'authorization: Bearer ${ATE_TOKEN}' \
                          -d "$2" api.ate-system.svc:443 substrate.ateapi.v1.Control/"$1"
                      }

                      uid() { printf '%s\n' "$1" | sed -n 's/.*"uid": *"\([^"]*\)".*/\1/p' | head -n 1; }
                      version() { printf '%s\n' "$1" | sed -n 's/.*"version": *"\([0-9]*\)".*/\1/p' | head -n 1; }
                      state() { printf '%s\n' "$1" | sed -n 's/.*"state": *"ACTOR_STATE_\([A-Z]*\)".*/\1/p' | head -n 1; }
                      template() { printf '%s\n' "$1" | sed -n '/"actorTemplate": *{/,/}/s/.*"name": *"\([^"]*\)".*/\1/p' | head -n 1; }

                      status=0
                      rpc CreateActorTemplate "$CREATE_TEMPLATE" >/dev/null || status=$?
                      case "$status" in
                      0) echo "template $TEMPLATE: created" ;;
                      70) echo "template $TEMPLATE: already exists" ;;
                      *) exit "$status" ;;
                      esac

                      status=0
                      actor=$(rpc GetActor "$ACTOR_REF") || status=$?
                      case "$status" in
                      0)
                        if [ "$(state "$actor")" = CRASHED ]; then
                          rpc RevertActor "$ACTOR_REF" >/dev/null
                          actor=$(rpc GetActor "$ACTOR_REF")
                          echo "actor: reverted from CRASHED"
                        fi
                        current=$(template "$actor")
                        if [ "$current" = "$TEMPLATE" ]; then
                          echo "actor: on $TEMPLATE"
                        else
                          if [ "$(state "$actor")" != SUSPENDED ]; then
                            rpc SuspendActor "$ACTOR_REF" >/dev/null
                          fi
                          actor=$(rpc GetActor "$ACTOR_REF")
                          rpc UpdateActor "$(printf "$UPDATE_ACTOR" "$(uid "$actor")" "$(version "$actor")")" >/dev/null
                          echo "actor: moved from $current to $TEMPLATE"
                        fi
                        ;;
                      69)
                        rpc CreateActor "$CREATE_ACTOR" >/dev/null
                        echo "actor: created on $TEMPLATE"
                        ;;
                      *) exit "$status" ;;
                      esac

                      status=0
                      policy=$(rpc GetActorEgressPolicy "$POLICY_REF") || status=$?
                      case "$status" in
                      0)
                        rpc UpdateActorEgressPolicy "$(printf "$UPDATE_POLICY" "$(uid "$policy")" "$(version "$policy")")" >/dev/null
                        echo "egress policy: updated"
                        ;;
                      69)
                        rpc CreateActorEgressPolicy "$CREATE_POLICY" >/dev/null
                        echo "egress policy: created"
                        ;;
                      *) exit "$status" ;;
                      esac

                      templates=$(rpc ListActorTemplates "$LIST_TEMPLATES")
                      for old in $(printf '%s\n' "$templates" | sed -n 's/.*"name": *"\(planboard-[0-9a-f]\{12\}-[0-9a-f]\{8\}\)".*/\1/p'); do
                        [ "$old" != "$TEMPLATE" ] || continue
                        status=0
                        rpc DeleteActorTemplate "$(printf "$DELETE_TEMPLATE" "$old")" >/dev/null || status=$?
                        case "$status" in
                        0) echo "template $old: deleted" ;;
                        69) echo "template $old: already gone" ;;
                        *) exit "$status" ;;
                        esac
                      done
                  env:
                    - name: TEMPLATE
                      value: planboard-3e0e30c72ee4-ba462d3d
                    - name: ACTOR_REF
                      value: '{"actor":{"atespace":"splunk","name":"planboard"}}'
                    - name: POLICY_REF
                      value: '{"actor":{"atespace":"splunk","name":"planboard"},"name":"default"}'
                    - name: LIST_TEMPLATES
                      value: '{"atespace":"splunk","options":{"pageSize":1000}}'
                    - name: CREATE_TEMPLATE
                      value: '{"actorTemplate":{"containers":[{"name":"sync","image":"quay.cartography.bank.internal/splunk/planboard@sha256:3e0e30c72ee4707e7fe4b1447b9902ca8a39fa1c4bffea81366c4bf3dc2c7726","command":["/bin/sh","-c","set -u\nrepo=/data/repo\nif [ ! -d \"$repo\" ]; then\n  rm -rf /data/clone\n  until git clone --branch \"$REPO_REF\" --single-branch \"$REPO_URL\" /data/clone; do\n    rm -rf /data/clone\n    sleep 5\n  done\n  mv /data/clone \"$repo\"\nfi\nfind \"$repo/.git\" -name ''*.lock'' -type f -delete\ngit -C \"$repo\" remote set-url origin \"$REPO_URL\"\nwhile :; do\n  git -C \"$repo\" fetch origin \"+refs/heads/$REPO_REF:refs/remotes/origin/$REPO_REF\" &&\n    git -C \"$repo\" reset --hard \"origin/$REPO_REF\"\n  sleep 30\ndone"],"env":[{"name":"REPO_URL","value":"https://github.com/holos-run/splunk-planning"},{"name":"REPO_REF","value":"main"},{"name":"REPO_PATH","value":""},{"name":"GIT_SSL_CAINFO","value":"/run/ate/egress-trust-bundle/trust-bundle.pem"},{"name":"GIT_TERMINAL_PROMPT","value":"0"},{"name":"GIT_HTTP_LOW_SPEED_LIMIT","value":"1000"},{"name":"GIT_HTTP_LOW_SPEED_TIME","value":"60"}],"volumeMounts":[{"name":"data","mountPath":"/data"},{"name":"system-info","mountPath":"/run/ate"}]},{"name":"board","image":"quay.cartography.bank.internal/splunk/planboard@sha256:3e0e30c72ee4707e7fe4b1447b9902ca8a39fa1c4bffea81366c4bf3dc2c7726","command":["/bin/sh","-c","root=\"/data/repo$REPO_PATH\"\nuntil [ -d \"$root\" ]; do sleep 1; done\nexec planboard --listen 0.0.0.0:80 --no-open \"$root\""],"env":[{"name":"REPO_URL","value":"https://github.com/holos-run/splunk-planning"},{"name":"REPO_REF","value":"main"},{"name":"REPO_PATH","value":""}],"wakeupProbe":{"httpGet":{"path":"/","port":80},"timeoutSeconds":120},"volumeMounts":[{"name":"data","mountPath":"/data"}]}],"metadata":{"atespace":"splunk","name":"planboard-3e0e30c72ee4-ba462d3d"},"volumes":[{"name":"data","durableDir":{}},{"name":"system-info","systemInfo":{"dataSources":[{"trustBundle":{"names":["egress-mitm.ate.dev","system-roots.ate.dev"],"path":"egress-trust-bundle/trust-bundle.pem"}}]}}],"resources":{"limits":{"cpuMillicores":500,"memoryBytes":536870912}},"snapshotConfig":{"preferredFidelity":"SNAPSHOT_FIDELITY_MEMORY","goldenSnapshotConfig":{"mode":"GOLDEN_SNAPSHOT_MODE_DISABLED"}}}}'
                    - name: CREATE_ACTOR
                      value: '{"actor":{"metadata":{"atespace":"splunk","name":"planboard"},"actorTemplate":{"atespace":"splunk","name":"planboard-3e0e30c72ee4-ba462d3d"}}}'
                    - name: UPDATE_ACTOR
                      value: '{"actor":{"metadata":{"atespace":"splunk","name":"planboard","uid":"%s","version":"%s"},"actorTemplate":{"atespace":"splunk","name":"planboard-3e0e30c72ee4-ba462d3d"}}}'
                    - name: CREATE_POLICY
                      value: '{"actor":{"atespace":"splunk","name":"planboard"},"egressPolicy":{"metadata":{"atespace":"splunk","name":"default"},"rules":[{"https":{"hostnames":["github.com"],"ports":{"numbers":[443]},"effects":{"replaceHeaders":[{"header":"authorization","prefix":"Basic ","credentialUri":"ate-secret://k8s.io/default/splunk/planboard-git/authorization"}]}}}]}}'
                    - name: UPDATE_POLICY
                      value: '{"actor":{"atespace":"splunk","name":"planboard"},"egressPolicy":{"metadata":{"atespace":"splunk","name":"default","uid":"%s","version":"%s"},"rules":[{"https":{"hostnames":["github.com"],"ports":{"numbers":[443]},"effects":{"replaceHeaders":[{"header":"authorization","prefix":"Basic ","credentialUri":"ate-secret://k8s.io/default/splunk/planboard-git/authorization"}]}}}]}}'
                    - name: DELETE_TEMPLATE
                      value: '{"actorTemplate":{"atespace":"splunk","name":"%s"}}'
                  image: docker.io/fullstorydev/grpcurl:v1.9.3-alpine@sha256:4614424ed58e9b9837c48b6b8eadb9ef40491d5af3499bcc8b378e9c64a9e4a9
                  name: setup
                  resources:
                    limits:
                        memory: 64Mi
                    requests:
                        cpu: 10m
                        memory: 32Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                    - mountPath: /var/run/ate/api
                      name: api
                      readOnly: true
            restartPolicy: OnFailure
            securityContext:
                runAsGroup: 101
                runAsNonRoot: true
                runAsUser: 100
                seccompProfile:
                    type: RuntimeDefault
            serviceAccountName: ate-client
            volumes:
                - name: api
                  projected:
                    sources:
                        - serviceAccountToken:
                            audience: api.ate-system.svc
                            expirationSeconds: 600
                            path: token
                        - clusterTrustBundle:
                            labelSelector:
                                matchLabels:
                                    podcert.ate.dev/canarying: live
                            path: ca.pem
                            signerName: servicedns.podcert.ate.dev/identity
