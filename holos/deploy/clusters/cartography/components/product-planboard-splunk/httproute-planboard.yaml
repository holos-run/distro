apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: splunk
    name: planboard
    namespace: splunk
spec:
    hostnames:
        - planboard.splunk.cartography.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: ingress-project-splunk
          namespace: istio-ingress
          sectionName: splunk
    rules:
        - backendRefs:
            - name: planboard-oauth2-proxy
              port: 4180
          filters:
            - requestHeaderModifier:
                remove:
                    - X-Forwarded-User
                    - X-Forwarded-Email
                    - X-Forwarded-Groups
                    - X-Forwarded-Preferred-Username
                    - X-Auth-Request-User
                    - X-Auth-Request-Email
                    - X-Auth-Request-Groups
                    - X-Auth-Request-Preferred-Username
                    - X-Auth-Request-Access-Token
                    - X-Forwarded-Access-Token
              type: RequestHeaderModifier
