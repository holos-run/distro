apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        holos.run/project: splunk
    name: k8s-credential-provider-planboard
    namespace: splunk
rules:
    - apiGroups:
        - ""
      resourceNames:
        - planboard-git
        - planboard-anthropic
      resources:
        - secrets
      verbs:
        - get
