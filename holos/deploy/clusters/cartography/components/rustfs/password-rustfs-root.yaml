apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: rustfs-root
  namespace: rustfs
spec:
  allowRepeat: true
  length: 32
  noUpper: false
  secretKeys:
  - RUSTFS_ACCESS_KEY
  - RUSTFS_SECRET_KEY
  symbols: 0
