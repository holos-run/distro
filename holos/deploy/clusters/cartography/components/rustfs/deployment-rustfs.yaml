apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/version: 1.0.4
    helm.sh/chart: rustfs-1.0.4
  name: rustfs
  namespace: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rustfs
      app.kubernetes.io/name: rustfs
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rustfs
        app.kubernetes.io/name: rustfs
    spec:
      affinity: null
      containers:
      - command:
        - /usr/bin/rustfs
        env:
        - name: RUSTFS_CHECK_UPDATE
          value: "false"
        envFrom:
        - configMapRef:
            name: rustfs-config
        - secretRef:
            name: rustfs-root
        image: docker.io/rustfs/rustfs:1.0.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        name: rustfs
        ports:
        - containerPort: 9000
          name: endpoint
        - containerPort: 9001
          name: console
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /data
          name: data
      imagePullSecrets: []
      initContainers:
      - command:
        - sh
        - -c
        - |
          mkdir -p /data
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: IfNotPresent
        name: init-step
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /data
          name: data
      priorityClassName: null
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: rustfs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rustfs-data
