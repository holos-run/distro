apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "34"
    name: project-splunk
    namespace: argocd
spec:
    destination:
        server: https://kubernetes.default.svc
    ignoreDifferences:
        - group: argoproj.io
          jsonPointers:
            - /spec/syncPolicy/automated
          kind: Application
          name: splunk
          namespace: argocd
    project: platform
    source:
        path: holos/deploy/clusters/cartography/components/project-splunk
        repoURL: https://github.com/holos-run/distro.git
        targetRevision: main
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        retry:
            backoff:
                duration: 5s
                factor: 2
                maxDuration: 3m
            limit: 10
        syncOptions:
            - ServerSideApply=true
            - RespectIgnoreDifferences=true
