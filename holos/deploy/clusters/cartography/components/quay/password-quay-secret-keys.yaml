apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
    annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    name: quay-secret-keys
    namespace: quay
spec:
    allowRepeat: true
    length: 32
    noUpper: false
    secretKeys:
        - SECRET_KEY
        - DATABASE_SECRET_KEY
    symbols: 0
