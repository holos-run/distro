apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
    name: rustfs
    namespace: quay
spec:
    provider:
        kubernetes:
            auth:
                serviceAccount:
                    name: quay-rustfs-reader
            remoteNamespace: rustfs
            server:
                caProvider:
                    key: ca.crt
                    name: kube-root-ca.crt
                    type: ConfigMap
