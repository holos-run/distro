apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/name: quay-redis
    name: quay-redis
    namespace: quay
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: quay-redis
    template:
        metadata:
            labels:
                app.kubernetes.io/name: quay-redis
        spec:
            automountServiceAccountToken: false
            containers:
                - args:
                    - redis-server
                    - --save
                    - ""
                    - --appendonly
                    - "no"
                  image: docker.io/library/redis:8.6.8-alpine@sha256:7d8d9a58ab3ef32025b06c9f9aeb273d0fb82a79f13d63658e7d7e56ee2f032c
                  livenessProbe:
                    tcpSocket:
                        port: redis
                  name: redis
                  ports:
                    - containerPort: 6379
                      name: redis
                  readinessProbe:
                    tcpSocket:
                        port: redis
                  resources:
                    limits:
                        memory: 128Mi
                    requests:
                        cpu: 25m
                        memory: 32Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                    - mountPath: /data
                      name: data
            securityContext:
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 999
                seccompProfile:
                    type: RuntimeDefault
            volumes:
                - emptyDir: {}
                  name: data
