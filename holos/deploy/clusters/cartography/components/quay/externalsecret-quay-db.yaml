apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    name: quay-db
    namespace: quay
spec:
    dataFrom:
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: quay-db
    refreshPolicy: CreatedOnce
    target:
        creationPolicy: Orphan
        immutable: true
        name: quay-db
        template:
            data:
                password: '{{ .password }}'
                username: quay
            engineVersion: v2
            mergePolicy: Replace
            type: kubernetes.io/basic-auth
