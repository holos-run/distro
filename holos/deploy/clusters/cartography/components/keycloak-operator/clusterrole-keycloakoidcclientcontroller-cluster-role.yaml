apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: keycloak-operator
    app.kubernetes.io/version: 26.8.1
  name: keycloakoidcclientcontroller-cluster-role
rules:
- apiGroups:
  - k8s.keycloak.org
  resources:
  - keycloakoidcclients
  - keycloakoidcclients/status
  - keycloakoidcclients/finalizers
  verbs:
  - get
  - list
  - watch
  - patch
  - update
  - create
  - delete
