apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    annotations:
        gateway.istio.io/service-account: ingress-gateway
    name: ingress
    namespace: istio-ingress
spec:
    addresses:
        - type: IPAddress
          value: 10.20.0.34
    allowedListeners:
        namespaces:
            from: Same
    gatewayClassName: istio
    infrastructure:
        parametersRef:
            group: ""
            kind: ConfigMap
            name: ingress-gateway
    listeners:
        - allowedRoutes:
            namespaces:
                from: All
          hostname: '*.cartography.bank.internal'
          name: https
          port: 443
          protocol: HTTPS
          tls:
            certificateRefs:
                - kind: Secret
                  name: wildcard-tls
            mode: Terminate
        - allowedRoutes:
            namespaces:
                from: Same
          hostname: '*.cartography.bank.internal'
          name: http
          port: 80
          protocol: HTTP
        - allowedRoutes:
            kinds:
                - group: gateway.networking.k8s.io
                  kind: TLSRoute
            namespaces:
                from: Selector
                selector:
                    matchExpressions:
                        - key: kubernetes.io/metadata.name
                          operator: In
                          values:
                            - substrate-shim
          hostname: '*.ate.cartography.bank.internal'
          name: ate
          port: 443
          protocol: TLS
          tls:
            mode: Passthrough
        - allowedRoutes:
            kinds:
                - group: gateway.networking.k8s.io
                  kind: TLSRoute
            namespaces:
                from: Selector
                selector:
                    matchExpressions:
                        - key: kubernetes.io/metadata.name
                          operator: In
                          values:
                            - seabank-authenticator
          hostname: k8s.cartography.bank.internal
          name: k8s
          port: 443
          protocol: TLS
          tls:
            mode: Passthrough
