apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceph-client-cartography
  namespace: ceph-csi-rbd
spec:
  dataFrom:
  - extract:
      key: ceph-client-cartography
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform
  target:
    creationPolicy: Owner
