apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
    labels:
        holos.run/project: choria
    name: planboard-shim
    namespace: choria
spec:
    exportTo:
        - .
    host: planboard.choria.ate.marina.bank.internal
    trafficPolicy:
        tls:
            caCertificates: /etc/private-ca/ca.crt
            mode: SIMPLE
            sni: planboard.choria.ate.marina.bank.internal
            subjectAltNames:
                - planboard.choria.ate.marina.bank.internal
