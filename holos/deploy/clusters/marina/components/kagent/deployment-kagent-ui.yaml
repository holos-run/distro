apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.0.0-holos.20261125.c1dbae1
    helm.sh/chart: kagent-0.0.0-holos.20261125.c1dbae1
  name: kagent-ui
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent
  template:
    metadata:
      annotations:
        checksum/configmap: c46b5543b83a98b5d910bd991c9224e95dbd46f481484e4675de69510741a29e
        checksum/ui-config: 0e4ac4a29e7c74e86069e4a5d3ccb80d23b77d3f7f67525e29f39d2671a34aba
      labels:
        app.kubernetes.io/component: ui
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: kagent-ui
        image: ghcr.io/holos-run/kagent/ui:0.0.0-holos.20261125.c1dbae1@sha256:81456ebc02822a0d678144cfbe3734ab892e4ca3a99ed2b69906bac06f898af3
        imagePullPolicy: IfNotPresent
        name: ui
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 1
          periodSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/nginx/nginx.conf
          name: ui-config
          readOnly: true
          subPath: nginx.conf
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kagent-ui
      volumes:
      - emptyDir:
          sizeLimit: 50Mi
        name: tmp
      - configMap:
          name: kagent-ui-config
        name: ui-config
