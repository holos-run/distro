apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: choria
    name: ate-choria
    namespace: ate-system
spec:
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: project-choria
          namespace: substrate-shim
          sectionName: choria
    rules:
        - backendRefs:
            - name: atenet-router
              port: 443
