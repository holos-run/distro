apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        holos.run/project: choria
    name: choria-owners
    namespace: choria
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: /projects/choria/roles/owner
