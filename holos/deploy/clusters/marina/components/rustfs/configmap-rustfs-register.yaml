apiVersion: v1
data:
  register.sh: |
    #!/bin/sh
    # Registers each consumer's bucket, user and policy with RustFS. Every
    # step converges, so it is safe to run again.
    set -euo pipefail

    # Wait for the S3 API; on a cold start the Job can run first.
    i=0
    until rc ready rustfs >/dev/null 2>&1; do
      i=$((i + 1))
      [ "$i" -lt 60 ] || { echo "rustfs is not ready"; exit 1; }
      sleep 5
    done

    register() {
      bucket=$1 access_key=$2 secret_key=$3
      rc mb --ignore-existing "rustfs/$bucket"
      cat >"/tmp/$bucket.json" <<EOF
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Action": [
          "s3:ListBucket", "s3:GetBucketLocation", "s3:ListBucketMultipartUploads",
          "s3:GetObject", "s3:PutObject", "s3:DeleteObject",
          "s3:ListMultipartUploadParts", "s3:AbortMultipartUpload"
        ],
        "Resource": ["arn:aws:s3:::$bucket", "arn:aws:s3:::$bucket/*"]
      }]
    }
    EOF
      rc admin policy create rustfs "$bucket" "/tmp/$bucket.json"
      rc admin user add rustfs "$access_key" "$secret_key"
      rc admin policy attach rustfs "$bucket" --user "$access_key"
      # Any other user with this policy has a key that was rotated away.
      # Under pipefail, a failed listing fails the Job.
      holders=$(rc admin policy entities rustfs --policy "$bucket" --json |
        jq -er --arg p "$bucket" '.data.policy_mappings[] | select(.policy == $p) | .users[]')
      for user in $holders; do
        [ "$user" = "$access_key" ] || rc admin user remove rustfs "$user"
      done
      echo "registered $bucket"
    }

    register substrate "$SUBSTRATE_ACCESS_KEY" "$SUBSTRATE_SECRET_KEY"
    register quay "$QUAY_ACCESS_KEY" "$QUAY_SECRET_KEY"
    register substrate-assets "$SUBSTRATE_ASSETS_ACCESS_KEY" "$SUBSTRATE_ASSETS_SECRET_KEY"

    # grant_read lets the users whose access keys follow bucket $1 list and
    # read it, and not write it, through group $1-readers and its policy
    # $1-read, and removes every other member from the group.
    grant_read() {
      bucket=$1
      shift
      cat >"/tmp/$bucket-read.json" <<EOF
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetObject"],
        "Resource": ["arn:aws:s3:::$bucket", "arn:aws:s3:::$bucket/*"]
      }]
    }
    EOF
      rc admin policy create rustfs "$bucket-read" "/tmp/$bucket-read.json"
      members=$(echo "$@" | tr ' ' ',')
      rc admin group add rustfs "$bucket-readers" --members "$members"
      rc admin policy attach rustfs "$bucket-read" --group "$bucket-readers"
      current=$(rc admin group info rustfs "$bucket-readers" --json | jq -er '.members[]')
      for user in $current; do
        case " $* " in
          *" $user "*) ;;
          *) rc admin group rm-members rustfs "$bucket-readers" "$user" ;;
        esac
      done
      echo "granted read on $bucket"
    }

    grant_read substrate-assets "$SUBSTRATE_ACCESS_KEY"
kind: ConfigMap
metadata:
  name: rustfs-register
  namespace: rustfs
