apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    annotations:
        gateway.istio.io/service-account: ingress-gateway
    name: ingress
    namespace: istio-ingress
spec:
    addresses:
        - type: IPAddress
          value: 10.20.0.30
    gatewayClassName: istio
    infrastructure:
        parametersRef:
            group: ""
            kind: ConfigMap
            name: ingress-gateway
    listeners:
        - allowedRoutes:
            namespaces:
                from: All
          hostname: '*.bank.internal'
          name: https
          port: 443
          protocol: HTTPS
          tls:
            certificateRefs:
                - kind: Secret
                  name: wildcard-tls
            mode: Terminate
        - allowedRoutes:
            namespaces:
                from: Same
          hostname: '*.bank.internal'
          name: http
          port: 80
          protocol: HTTP
        - allowedRoutes:
            kinds:
                - group: gateway.networking.k8s.io
                  kind: TLSRoute
            namespaces:
                from: Selector
                selector:
                    matchExpressions:
                        - key: kubernetes.io/metadata.name
                          operator: In
                          values:
                            - cert-manager
                            - istio-system
          hostname: '*.webhooks.spike.bank.internal'
          name: webhooks
          port: 9443
          protocol: TLS
          tls:
            mode: Passthrough
