apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: private-ca-root
    namespace: cert-manager
spec:
    commonName: Holos spike root CA
    duration: 87600h
    isCA: true
    issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: private-ca-bootstrap
    privateKey:
        algorithm: ECDSA
        rotationPolicy: Never
        size: 256
    secretName: private-ca-root
    subject:
        organizationalUnits:
            - spike.bank.internal
        organizations:
            - Holos
