apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        holos.run/project: checkout
    name: checkout-wildcard
    namespace: substrate-shim
spec:
    dnsNames:
        - '*.checkout.ate.treasury.bank.internal'
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: private-ca
    privateKey:
        algorithm: ECDSA
        size: 256
    secretName: checkout-wildcard-tls
