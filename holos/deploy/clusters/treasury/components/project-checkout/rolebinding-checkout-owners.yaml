apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        holos.run/project: checkout
    name: checkout-owners
    namespace: checkout
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: /projects/checkout/roles/owner
