apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: checkout
    name: ate-checkout
    namespace: ate-system
spec:
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: project-checkout
          namespace: substrate-shim
          sectionName: checkout
    rules:
        - backendRefs:
            - name: atenet-router
              port: 443
