apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        holos.run/project: payments
    name: payments-wildcard
    namespace: substrate-shim
spec:
    dnsNames:
        - '*.payments.ate.treasury.bank.internal'
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: private-ca
    privateKey:
        algorithm: ECDSA
        size: 256
    secretName: payments-wildcard-tls
