        argocd.argoproj.io/sync-wave: "-1"
    labels:
        holos.run/project: payments
    name: approver-policy:project-payments
rules:
    - apiGroups:
        - policy.cert-manager.io
      resourceNames:
        - project-payments
      resources:
        - certificaterequestpolicies
      verbs:
        - use
