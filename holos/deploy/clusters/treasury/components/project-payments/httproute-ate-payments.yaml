apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: payments
    name: ate-payments
    namespace: ate-system
spec:
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: project-payments
          namespace: substrate-shim
          sectionName: payments
    rules:
        - backendRefs:
            - name: atenet-router
              port: 443
