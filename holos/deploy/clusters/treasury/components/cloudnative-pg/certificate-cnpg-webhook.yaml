apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-webhook
  namespace: cnpg-system
spec:
  dnsNames:
  - cnpg-webhook-service.cnpg-system.svc
  - cnpg-webhook-service.cnpg-system.webhooks.treasury.bank.internal
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: private-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: cnpg-webhook-tls
