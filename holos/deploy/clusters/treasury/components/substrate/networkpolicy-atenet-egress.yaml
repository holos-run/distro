apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atenet-egress
  namespace: ate-system
spec:
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchExpressions:
        - key: ate.dev/worker-pool
          operator: Exists
    ports:
    - port: https
      protocol: TCP
  podSelector:
    matchLabels:
      app: atenet-egress
  policyTypes:
  - Ingress
