apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: substrate-db
  namespace: ate-system
spec:
  bootstrap:
    initdb:
      database: substrate
      owner: substrate
      secret:
        name: substrate-db
  certificates:
    serverCASecret: substrate-db-server-tls
    serverTLSSecret: substrate-db-server-tls
  enablePDB: false
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  instances: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  storage:
    size: 10Gi
  superuserSecret:
    name: substrate-db-superuser
