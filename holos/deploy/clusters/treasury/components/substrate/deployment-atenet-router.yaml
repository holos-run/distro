apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: atenet-router
  name: atenet-router
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      annotations:
        holos.run/config-hash: c833980c
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: atenet-router
    spec:
      containers:
      - args:
        - router
        - --mode=ingress
        - --namespace=ate-system
        - --port-xds=18000
        - --port-extproc=50051
        - --extproc-address=127.0.0.1
        - --status-port=4040
        - --port-https=8443
        - --envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --port-connect-tls=8444
        - --ingress-client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --ateapi-address=k8s:///api.ate-system.svc:443
        - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --drain-delay=13s
        - --ingress-allowed-spiffe-ids=spiffe://cluster.local/ns/substrate-shim/sa/ate-gateway,spiffe://cluster.local/ns/kagent/sa/kagent-controller
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: ghcr.io/holos-run/substrate/atenet@sha256:eab33c963d7a6eb2a83647b13e1ef906ef02897362cebcbce1d933f88325f766
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: atenet-router
        ports:
        - containerPort: 50051
          name: extproc
        - containerPort: 9090
          name: metrics
        - containerPort: 9091
          name: health
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/servicedns-ca
          name: servicedns-ca
        - mountPath: /var/run/atenet
          name: drain-signal
      - command:
        - /usr/local/bin/envoy
        - -c
        - /etc/envoy/envoy.yaml
        image: ghcr.io/holos-run/substrate/envoy-dataplane@sha256:590650c5db48cc88b4c363ab91dce076e15be4e76c6bbb83316068d44b6c553f
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done
        name: envoy
        ports:
        - containerPort: 8443
          name: https
        - containerPort: 8444
          name: connect-tls
        - containerPort: 9902
          name: envoy-metrics
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /etc/envoy
          name: envoy-config
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /var/run/atenet
          name: drain-signal
          readOnly: true
      serviceAccountName: atenet-router
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: atenet-router-envoy-config
        name: envoy-config
      - emptyDir: {}
        name: drain-signal
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
