apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: substrate-db
  namespace: ate-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - port: 8000
      protocol: TCP
    - port: 5432
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: ate-api-server
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: substrate-db-setup
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      cnpg.io/cluster: substrate-db
  policyTypes:
  - Ingress
