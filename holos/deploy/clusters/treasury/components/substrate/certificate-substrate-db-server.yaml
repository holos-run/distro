apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: substrate-db-server
  namespace: ate-system
spec:
  dnsNames:
  - substrate-db-rw
  - substrate-db-rw.ate-system
  - substrate-db-rw.ate-system.svc
  - substrate-db-rw.ate-system.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: private-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: substrate-db-server-tls
  usages:
  - server auth
