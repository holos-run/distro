apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-idp-server
  namespace: ate-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ate-idp-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ate-idp-server
    spec:
      containers:
      - args:
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --issuer=https://idp.ate-system.svc
        image: ghcr.io/holos-run/substrate/ate-idp-server@sha256:f93be95c1ee43fcbc619e6eb43d5392bef15c19d3fdf25e5d2251e28203c67b7
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 10
        name: ate-idp-server
        ports:
        - containerPort: 8443
          name: https
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
        - mountPath: /run/actor-id-jwt-pool
          name: actor-id-jwt-pool
      serviceAccountName: ate-idp-server
      volumes:
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-jwt-pool
