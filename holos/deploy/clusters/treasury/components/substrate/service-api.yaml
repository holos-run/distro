apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ate-system
spec:
  clusterIP: None
  ipFamilyPolicy: PreferDualStack
  ports:
  - name: grpc
    port: 443
    protocol: TCP
    targetPort: 443
  - name: exchange
    port: 8445
    protocol: TCP
    targetPort: 8445
  selector:
    app: ate-api-server
