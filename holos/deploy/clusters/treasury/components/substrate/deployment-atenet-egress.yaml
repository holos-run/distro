apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: atenet-egress
  name: atenet-egress
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-egress
  template:
    metadata:
      annotations:
        holos.run/config-hash: c833980c
      labels:
        app: atenet-egress
    spec:
      containers:
      - args:
        - -c
        - /etc/envoy/envoy.yaml
        - --service-node
        - atenet-egress
        - --service-cluster
        - atenet-egress
        image: ghcr.io/holos-run/substrate/envoy-dataplane@sha256:e1016f18e8e30236cc0535a7eb9955a9f9892ed23044447d4c87f446a1dc6bf6
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done
        name: envoy
        ports:
        - containerPort: 443
          name: https
        - containerPort: 15090
          name: envoy-metrics
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 1
        volumeMounts:
        - mountPath: /etc/envoy
          name: config
          readOnly: true
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
        - mountPath: /run/actor-id-ca-certs
          name: actor-id-ca-certs
          readOnly: true
        - mountPath: /var/run/atenet
          name: drain-signal
          readOnly: true
        - mountPath: /var/run/sdsmint
          name: sdsmint-sock
      - args:
        - router
        - --mode=egress
        - --namespace=ate-system
        - --port-extproc=50051
        - --extproc-address=127.0.0.1
        - --ateapi-address=dns:///api.ate-system.svc:443
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --actor-identity-ca-file=/run/actor-id-ca-certs/ca.crt
        - --otlp-collector-address=
        - --envoy-admin-address=127.0.0.1:15000
        - --credential-provider-name=k8s.io
        - --credential-provider-address=k8s-credential-provider.ate-system.svc:50051
        - --credential-provider-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --credential-provider-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --credential-provider-server-name=k8s-credential-provider.ate-system.svc
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: ghcr.io/holos-run/substrate/atenet@sha256:92cb0ffb6b74cc30c9b559648d95500bf9f79ddd97b3067833d90b974342f6fa
        name: ext-proc
        ports:
        - containerPort: 50051
          name: extproc
        - containerPort: 9090
          name: metrics
        - containerPort: 9091
          name: health
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
        - mountPath: /run/actor-id-ca-certs
          name: actor-id-ca-certs
          readOnly: true
        - mountPath: /var/run/atenet
          name: drain-signal
      initContainers:
      - args:
        - sdsmint
        - --uds-path=/var/run/sdsmint/sdsmint.sock
        - --ca-pool-path=/run/ca-state/mitm-pool.json
        - --leaf-cert-ttl=15m
        - --log-level=info
        env:
        - name: GOMEMLIMIT
          value: 640MiB
        image: ghcr.io/holos-run/substrate/atenet@sha256:92cb0ffb6b74cc30c9b559648d95500bf9f79ddd97b3067833d90b974342f6fa
        name: sdsmint
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 200m
            memory: 512Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/run/sdsmint
          name: sdsmint-sock
        - mountPath: /run/ca-state
          name: ca-state
          readOnly: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      serviceAccountName: atenet-egress
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: atenet-egress
        name: config
      - emptyDir: {}
        name: drain-signal
      - emptyDir: {}
        name: sdsmint-sock
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: actor-id-ca-certs
        secret:
          secretName: actor-id-ca-certs
      - name: ca-state
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: mitm-pool.json
              name: egress-mitm-ca-pool
