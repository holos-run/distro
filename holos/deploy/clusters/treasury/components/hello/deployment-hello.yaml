apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        holos.run/gitops-test: signed
    name: hello
    namespace: hello
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: hello
    template:
        metadata:
            labels:
                app.kubernetes.io/name: hello
        spec:
            containers:
                - args:
                    - --port
                    - "8080"
                    - --name
                    - hello
                  image: docker.io/traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
                  name: whoami
                  ports:
                    - containerPort: 8080
                      name: http
                  readinessProbe:
                    httpGet:
                        path: /health
                        port: http
                  resources:
                    limits:
                        memory: 32Mi
                    requests:
                        cpu: 10m
                        memory: 16Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    readOnlyRootFilesystem: true
            securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                    type: RuntimeDefault
            serviceAccountName: hello
