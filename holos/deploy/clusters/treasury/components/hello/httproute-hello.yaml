apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: hello
    namespace: hello
spec:
    hostnames:
        - hello.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: https
    rules:
        - backendRefs:
            - name: hello
              port: 80
