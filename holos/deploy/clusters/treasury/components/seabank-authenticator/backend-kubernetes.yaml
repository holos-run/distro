apiVersion: authenticator.holos.run/v1alpha1
kind: Backend
metadata:
  name: kubernetes
  namespace: seabank-authenticator
spec:
  groupMapping:
    anyOf:
    - /platform/owners
    - /projects/cards/roles/owner
    - /projects/checkout/roles/owner
    - /projects/ledger/roles/owner
    - /projects/lending/roles/owner
    - /projects/payments/roles/owner
  groupsHeaderSeparator: '|'
  host: k8s.treasury.bank.internal
  oidc:
    clientID: kubectl
    groupsClaim: groups
    issuerURL: https://keycloak.treasury.bank.internal/realms/default
    usernameClaim: preferred_username
    usernamePrefix: 'oidc:'
  server:
    url: https://kubernetes.default.svc
  serviceAccountRef:
    name: seabank-authenticator-impersonator
