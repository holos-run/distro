apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    app: istiod
    app.kubernetes.io/instance: istio-base
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: istiod
    app.kubernetes.io/part-of: istio
    app.kubernetes.io/version: 1.31.3
    helm.sh/chart: base-1.31.3
    istio: istiod
    istio.io/rev: default
    release: istio-base
  name: istiod-default-validator
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    url: https://istiod.istio-system.webhooks.treasury.bank.internal:9443/validate
  failurePolicy: Fail
  name: validation.istio.io
  rules:
  - apiGroups:
    - security.istio.io
    - networking.istio.io
    - telemetry.istio.io
    - extensions.istio.io
    apiVersions:
    - '*'
    operations:
    - CREATE
    - UPDATE
    resources:
    - '*'
  sideEffects: None
  timeoutSeconds: 3
