apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: everything
    namespace: toolhive
spec:
    hostnames:
        - toolhive.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: https
    rules:
        - backendRefs:
            - name: mcp-everything-proxy
              port: 8080
