apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
    name: everything
    namespace: toolhive
spec:
    args:
        - streamableHttp
    audit:
        enabled: true
    authzConfigRef:
        name: everything
    env:
        - name: PORT
          value: "3001"
    image: ghcr.io/stacklok/dockyard/npx/server-everything:2026.8.31@sha256:cb2e2287d4b6a7d25affee2cde10265bfbf91f9dc38d5cbc8165c6b23fd0cded
    mcpPort: 3001
    oidcConfigRef:
        audience: kubectl
        name: keycloak
        resourceUrl: https://toolhive.bank.internal/mcp
        scopes:
            - openid
            - profile
            - email
            - groups
    podTemplateSpec:
        spec:
            containers:
                - name: mcp
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    runAsNonRoot: true
                    seccompProfile:
                        type: RuntimeDefault
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
    proxyPort: 8080
    resources:
        limits:
            memory: 256Mi
        requests:
            cpu: 10m
            memory: 64Mi
    transport: streamable-http
