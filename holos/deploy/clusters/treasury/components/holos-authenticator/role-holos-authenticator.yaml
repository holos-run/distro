apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: holos-authenticator
  namespace: holos-authenticator
rules:
- apiGroups:
  - authenticator.holos.run
  resources:
  - backends
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authenticator.holos.run
  resources:
  - backends/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - authenticator.holos.run
  resources:
  - backends/finalizers
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resourceNames:
  - holos-authenticator-impersonator
  resources:
  - serviceaccounts/token
  verbs:
  - create
