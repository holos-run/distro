apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes
  namespace: holos-authenticator
spec:
  hostnames:
  - k8s.bank.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: k8s
    namespace: holos-authenticator
  rules:
  - backendRefs:
    - name: kubernetes
      namespace: default
      port: 443
    filters:
    - requestHeaderModifier:
        remove:
        - X-Forwarded-For
        - X-Real-IP
      type: RequestHeaderModifier
