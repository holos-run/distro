apiVersion: v1
data:
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: k8s
kind: ConfigMap
metadata:
  name: k8s-gateway
  namespace: holos-authenticator
