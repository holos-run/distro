apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from-secret: cert-manager/trust-manager-tls
    holos.run/contract-exception: ADR 0001's Gateway webhook path, kept on treasury
      until its rebuild; see ADR 0003 and Talos_Control_Plane_Ready/rebuild-treasury-on-the-new-layer
  labels:
    app: trust-manager
    app.kubernetes.io/instance: trust-manager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trust-manager
    app.kubernetes.io/version: v0.25.0
    helm.sh/chart: trust-manager-v0.25.0
  name: trust-manager
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    url: https://trust-manager.cert-manager.webhooks.treasury.bank.internal:9443/validate-trust-cert-manager-io-v1alpha1-bundle
  failurePolicy: Fail
  name: trust.cert-manager.io
  rules:
  - apiGroups:
    - trust.cert-manager.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - bundles
  sideEffects: None
  timeoutSeconds: 3
