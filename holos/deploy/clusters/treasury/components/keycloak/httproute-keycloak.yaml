apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: keycloak
    namespace: keycloak
spec:
    hostnames:
        - keycloak.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: https
    rules:
        - backendRefs:
            - name: keycloak-service
              port: 8080
