apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: keycloak-allow-hbone
    namespace: keycloak
spec:
    ingress:
        - ports:
            - port: 15008
              protocol: TCP
    podSelector:
        matchLabels:
            app: keycloak
            app.kubernetes.io/instance: keycloak
            app.kubernetes.io/managed-by: keycloak-operator
    policyTypes:
        - Ingress
