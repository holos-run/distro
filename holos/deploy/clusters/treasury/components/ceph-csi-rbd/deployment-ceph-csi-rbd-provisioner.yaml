apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ceph-csi-rbd
    chart: ceph-csi-rbd-3.17.1
    component: provisioner
    heritage: Helm
    release: ceph-csi-rbd
  name: ceph-csi-rbd-provisioner
  namespace: ceph-csi-rbd
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ceph-csi-rbd
      component: provisioner
      release: ceph-csi-rbd
  strategy:
    rollingUpdate:
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ceph-csi-rbd
        chart: ceph-csi-rbd-3.17.1
        component: provisioner
        heritage: Helm
        release: ceph-csi-rbd
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: holos.run/pod-network
                operator: NotIn
                values:
                - none
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - ceph-csi-rbd
              - key: component
                operator: In
                values:
                - provisioner
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --nodeid=$(NODE_ID)
        - --type=rbd
        - --controllerserver=true
        - --automaxprocs=true
        - --pidlimit=-1
        - --endpoint=$(CSI_ENDPOINT)
        - --csi-addons-endpoint=$(CSI_ADDONS_ENDPOINT)
        - --v=5
        - --drivername=$(DRIVER_NAME)
        - --rbdhardmaxclonedepth=8
        - --rbdsoftmaxclonedepth=4
        - --maxsnapshotsonimage=450
        - --minsnapshotsonimage=250
        - --setmetadata=true
        - --logslowopinterval=30s
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DRIVER_NAME
          value: rbd.csi.ceph.com
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CSI_ENDPOINT
          value: unix:///csi/csi-provisioner.sock
        - name: CSI_ADDONS_ENDPOINT
          value: unix:///csi/csi-addons.sock
        image: quay.io/cephcsi/cephcsi:v3.17.1
        imagePullPolicy: IfNotPresent
        name: csi-rbdplugin
        resources: {}
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /dev
          name: host-dev
        - mountPath: /sys
          name: host-sys
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
        - mountPath: /etc/ceph-csi-config/
          name: ceph-csi-config
        - mountPath: /etc/ceph/
          name: ceph-config
        - mountPath: /etc/ceph-csi-encryption-kms-config/
          name: ceph-csi-encryption-kms-config
        - mountPath: /tmp/csi/keys
          name: keys-tmp-dir
        - mountPath: /run/secrets/tokens
          name: oidc-token
          readOnly: true
      - args:
        - --csi-address=$(ADDRESS)
        - --v=1
        - --timeout=60s
        - --leader-election=true
        - --retry-interval-start=500ms
        - --default-fstype=ext4
        - --extra-create-metadata=true
        - --automaxprocs=true
        - --prevent-volume-mode-conversion=true
        - --immediate-topology=false
        env:
        - name: ADDRESS
          value: unix:///csi/csi-provisioner.sock
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.2.0
        imagePullPolicy: IfNotPresent
        name: csi-provisioner
        resources: {}
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --v=1
        - --csi-address=$(ADDRESS)
        - --timeout=60s
        - --leader-election
        - --retry-interval-start=500ms
        - --handle-volume-inuse-error=false
        - --feature-gates=RecoverVolumeExpansionFailure=true
        - --automaxprocs=true
        env:
        - name: ADDRESS
          value: unix:///csi/csi-provisioner.sock
        image: registry.k8s.io/sig-storage/csi-resizer:v2.1.0
        imagePullPolicy: IfNotPresent
        name: csi-resizer
        resources: {}
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --automaxprocs=true
        - --v=1
        - --csi-address=$(ADDRESS)
        - --leader-election=true
        - --retry-interval-start=500ms
        - --default-fstype=ext4
        env:
        - name: ADDRESS
          value: unix:///csi/csi-provisioner.sock
        image: registry.k8s.io/sig-storage/csi-attacher:v4.11.0
        imagePullPolicy: IfNotPresent
        name: csi-attacher
        resources: {}
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --type=controller
        - --v=5
        - --drivername=$(DRIVER_NAME)
        - --drivernamespace=$(DRIVER_NAMESPACE)
        - --setmetadata=true
        env:
        - name: DRIVER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DRIVER_NAME
          value: rbd.csi.ceph.com
        image: quay.io/cephcsi/cephcsi:v3.17.1
        imagePullPolicy: IfNotPresent
        name: csi-rbdplugin-controller
        resources: {}
        volumeMounts:
        - mountPath: /etc/ceph-csi-config/
          name: ceph-csi-config
        - mountPath: /tmp/csi/keys
          name: keys-tmp-dir
        - mountPath: /etc/ceph/
          name: ceph-config
      - args:
        - --type=liveness
        - --endpoint=$(CSI_ENDPOINT)
        - --metricsport=8080
        - --metricspath=/metrics
        - --polltime=60s
        - --timeout=3s
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi-provisioner.sock
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: quay.io/cephcsi/cephcsi:v3.17.1
        imagePullPolicy: IfNotPresent
        name: liveness-prometheus
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        resources: {}
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      hostNetwork: false
      priorityClassName: system-cluster-critical
      securityContext: {}
      serviceAccountName: ceph-csi-rbd-provisioner
      volumes:
      - emptyDir:
          medium: Memory
        name: socket-dir
      - hostPath:
          path: /dev
        name: host-dev
      - hostPath:
          path: /sys
        name: host-sys
      - hostPath:
          path: /lib/modules
        name: lib-modules
      - configMap:
          name: ceph-config
        name: ceph-config
      - configMap:
          name: ceph-csi-config
        name: ceph-csi-config
      - configMap:
          name: ceph-csi-encryption-kms-config
        name: ceph-csi-encryption-kms-config
      - emptyDir:
          medium: Memory
        name: keys-tmp-dir
      - name: oidc-token
        projected:
          sources:
          - serviceAccountToken:
              audience: ceph-csi-kms
              expirationSeconds: 3600
              path: oidc-token
