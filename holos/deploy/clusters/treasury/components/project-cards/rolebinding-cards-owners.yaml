apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        holos.run/project: cards
    name: cards-owners
    namespace: cards
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: /projects/cards/roles/owner
