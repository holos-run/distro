apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: cards
    name: ate-cards
    namespace: ate-system
spec:
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: project-cards
          namespace: substrate-shim
          sectionName: cards
    rules:
        - backendRefs:
            - name: atenet-router
              port: 443
