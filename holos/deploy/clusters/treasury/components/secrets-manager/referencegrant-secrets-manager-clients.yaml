apiVersion: security.holos.run/v1alpha1
kind: ReferenceGrant
metadata:
    name: secrets-manager-clients
    namespace: keycloak
spec:
    from:
        - group: keycloak.holos.run
          kind: Client
          namespace: secrets-manager
    to:
        - group: keycloak.holos.run
          kind: Instance
          name: holos
