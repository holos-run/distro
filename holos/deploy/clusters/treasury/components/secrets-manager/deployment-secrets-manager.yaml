apiVersion: apps/v1
kind: Deployment
metadata:
    name: secrets-manager
    namespace: secrets-manager
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: secrets-manager
    template:
        metadata:
            labels:
                app.kubernetes.io/name: secrets-manager
        spec:
            containers:
                - args:
                    - --plain-http
                    - --listen=:8080
                    - --origin=https://secrets.bank.internal
                    - --issuer=https://keycloak.bank.internal/realms/holos
                    - --client-id=secrets-manager
                    - --ca-cert=/etc/ssl/private-ca/ca.crt
                    - --roles-claim=groups
                    - --disable-org-creation
                    - --org-creator-roles=/platform/owners
                  image: ghcr.io/holos-run/secrets-manager:v0.20.0@sha256:e33d995aa4f21d4861b5e7715e9674f8bf305278cf359ad32f9ea55d38272d5c
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: http
                  name: secrets-manager
                  ports:
                    - containerPort: 8080
                      name: http
                  readinessProbe:
                    httpGet:
                        path: /readyz
                        port: http
                  resources:
                    limits:
                        memory: 128Mi
                    requests:
                        cpu: 10m
                        memory: 32Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                    - mountPath: /etc/ssl/private-ca
                      name: private-ca
                      readOnly: true
            securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                    type: RuntimeDefault
            serviceAccountName: secrets-manager
            volumes:
                - configMap:
                    name: private-ca
                  name: private-ca
