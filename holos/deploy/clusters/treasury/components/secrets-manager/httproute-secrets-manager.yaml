apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: secrets-manager
    namespace: secrets-manager
spec:
    hostnames:
        - secrets.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: https
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: /metrics
        - backendRefs:
            - name: secrets-manager
              port: 8080
