apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: bank-of-pinky-controller-quay-creds
    namespace: bank-of-pinky-controller
spec:
    dataFrom:
        - extract:
            key: quay-controller-token
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: platform
    target:
        creationPolicy: Owner
