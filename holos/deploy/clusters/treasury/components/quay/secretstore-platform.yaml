apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
    name: platform
    namespace: seabank-controller
spec:
    provider:
        kubernetes:
            auth:
                serviceAccount:
                    name: seabank-controller-platform-reader
            remoteNamespace: seabank-prj-platform
            server:
                caProvider:
                    key: ca.crt
                    name: kube-root-ca.crt
                    type: ConfigMap
