apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: quay
    namespace: quay
spec:
    hostnames:
        - quay.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: https
    rules:
        - backendRefs:
            - name: quay
              port: 8080
