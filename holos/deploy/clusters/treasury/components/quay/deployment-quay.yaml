apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/name: quay
    name: quay
    namespace: quay
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: quay
    strategy:
        type: Recreate
    template:
        metadata:
            annotations:
                holos.run/config-hash: 7b97e821
            labels:
                app.kubernetes.io/name: quay
        spec:
            containers:
                - env:
                    - name: WORKER_COUNT_WEB
                      value: "2"
                    - name: WORKER_COUNT_REGISTRY
                      value: "2"
                    - name: WORKER_COUNT_SECSCAN
                      value: "1"
                    - name: WORKER_COUNT_UNSUPPORTED_MINIMUM
                      value: "1"
                  image: quay.io/projectquay/quay:3.17.6@sha256:e1f7407f90b169247c9a0714ed2cfdd61b24292ed708a12385fd89a762f004a2
                  livenessProbe:
                    httpGet:
                        path: /health/instance
                        port: http
                    timeoutSeconds: 5
                  name: quay
                  ports:
                    - containerPort: 8080
                      name: http
                  readinessProbe:
                    httpGet:
                        path: /health/instance
                        port: http
                    timeoutSeconds: 5
                  resources:
                    limits:
                        memory: 6Gi
                    requests:
                        cpu: 500m
                        memory: 4Gi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                  startupProbe:
                    failureThreshold: 60
                    httpGet:
                        path: /health/instance
                        port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                  volumeMounts:
                    - mountPath: /conf/stack
                      name: config
                    - mountPath: /conf/stack/extra_ca_certs
                      name: private-ca
                      readOnly: true
            initContainers:
                - command:
                    - python3
                    - -c
                    - |-
                      import json, os

                      env = os.environ
                      values = {
                          "DB_URI": "postgresql://quay:%s@quay-db-rw:5432/quay" % env["DB_PASSWORD"],
                          "SECRET_KEY": env["SECRET_KEY"],
                          "DATABASE_SECRET_KEY": env["DATABASE_SECRET_KEY"],
                          "OIDC_CLIENT_SECRET": env["OIDC_CLIENT_SECRET"],
                          "S3_ACCESS_KEY": env["S3_ACCESS_KEY"],
                          "S3_SECRET_KEY": env["S3_SECRET_KEY"],
                      }
                      config = open("/conf/template/config.yaml").read()
                      for key, value in values.items():
                          placeholder = "__%s__" % key
                          if placeholder not in config:
                              raise SystemExit("config template has no " + placeholder)
                          config = config.replace(placeholder, json.dumps(value))
                      with open("/conf/stack/config.yaml", "w") as f:
                          f.write(config)
                      print("wrote /conf/stack/config.yaml")
                  env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            key: password
                            name: quay-db
                    - name: SECRET_KEY
                      valueFrom:
                        secretKeyRef:
                            key: SECRET_KEY
                            name: quay-secret-keys
                    - name: DATABASE_SECRET_KEY
                      valueFrom:
                        secretKeyRef:
                            key: DATABASE_SECRET_KEY
                            name: quay-secret-keys
                    - name: OIDC_CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                            key: client-secret
                            name: quay-oidc
                    - name: S3_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                            key: access-key
                            name: rustfs-quay
                    - name: S3_SECRET_KEY
                      valueFrom:
                        secretKeyRef:
                            key: secret-key
                            name: rustfs-quay
                  image: quay.io/projectquay/quay:3.17.6@sha256:e1f7407f90b169247c9a0714ed2cfdd61b24292ed708a12385fd89a762f004a2
                  name: config
                  resources:
                    limits:
                        memory: 256Mi
                    requests:
                        cpu: 10m
                        memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                    - mountPath: /conf/template
                      name: config-template
                      readOnly: true
                    - mountPath: /conf/stack
                      name: config
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            serviceAccountName: quay
            volumes:
                - configMap:
                    name: quay-config-template
                  name: config-template
                - emptyDir: {}
                  name: config
                - configMap:
                    items:
                        - key: ca.crt
                          path: private-ca.crt
                    name: private-ca
                  name: private-ca
