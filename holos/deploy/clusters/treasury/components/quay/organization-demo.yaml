apiVersion: quay.holos.run/v1alpha1
kind: Organization
metadata:
    name: demo
    namespace: quay
spec:
    credentialsSecretRef:
        name: bank-of-pinky-controller-quay-creds
    deletionPolicy: Orphan
    email: quay+demo@bank.internal
    name: demo
    syncedTeams:
        - name: platformowners
          oidcGroup: /platform/owners
          role: admin
