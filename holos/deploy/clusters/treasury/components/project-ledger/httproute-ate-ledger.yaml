apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: ledger
    name: ate-ledger
    namespace: ate-system
spec:
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: project-ledger
          namespace: substrate-shim
          sectionName: ledger
    rules:
        - backendRefs:
            - name: atenet-router
              port: 443
