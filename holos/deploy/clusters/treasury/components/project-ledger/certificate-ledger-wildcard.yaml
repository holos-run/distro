apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        holos.run/project: ledger
    name: ledger-wildcard
    namespace: substrate-shim
spec:
    dnsNames:
        - '*.ledger.ate.treasury.bank.internal'
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: private-ca
    privateKey:
        algorithm: ECDSA
        size: 256
    secretName: ledger-wildcard-tls
