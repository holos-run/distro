apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        holos.run/project: ledger
    name: ledger-owners
    namespace: ledger
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: /projects/ledger/roles/owner
