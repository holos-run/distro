apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: cert-manager-approver-policy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-approver-policy
    app.kubernetes.io/version: v0.29.0
    helm.sh/chart: cert-manager-approver-policy-v0.29.0
  name: cert-manager-approver-policy
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-manager-approver-policy
  template:
    metadata:
      labels:
        app: cert-manager-approver-policy
        app.kubernetes.io/instance: cert-manager-approver-policy
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: cert-manager-approver-policy
        app.kubernetes.io/version: v0.29.0
        helm.sh/chart: cert-manager-approver-policy-v0.29.0
    spec:
      containers:
      - args:
        - --log-format=text
        - --log-level=1
        - --metrics-bind-address=:9402
        - --readiness-probe-bind-address=:6060
        - --webhook-host=0.0.0.0
        - --webhook-port=10250
        - --webhook-service-name=cert-manager-approver-policy
        - --webhook-ca-secret-namespace=cert-manager
        - --webhook-ca-secret-name=cert-manager-approver-policy-tls
        image: quay.io/jetstack/cert-manager-approver-policy:v0.29.0@sha256:b516dba9e41d8e29957fa8f16479fb109741f7d3f418ef6aa2b47221dfdd5ef3
        imagePullPolicy: IfNotPresent
        name: cert-manager-approver-policy
        ports:
        - containerPort: 10250
          name: webhook
        - containerPort: 9402
          name: metrics
        - containerPort: 6060
          name: healthcheck
        readinessProbe:
          httpGet:
            path: /readyz
            port: 6060
          initialDelaySeconds: 3
          periodSeconds: 7
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cert-manager-approver-policy
