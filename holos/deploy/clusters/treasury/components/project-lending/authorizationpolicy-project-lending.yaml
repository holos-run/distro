apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
    labels:
        holos.run/project: lending
    name: project-lending
    namespace: substrate-shim
spec:
    action: ALLOW
    rules:
        - from:
            - source:
                requestPrincipals:
                    - https://keycloak.treasury.bank.internal/realms/default/*
          to:
            - operation:
                hosts:
                    - '*.lending.ate.treasury.bank.internal'
                    - '*.lending.ate.treasury.bank.internal:443'
          when:
            - key: request.auth.claims[groups]
              values:
                - /platform/owners
                - /projects/lending/roles/owner
    targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ate
