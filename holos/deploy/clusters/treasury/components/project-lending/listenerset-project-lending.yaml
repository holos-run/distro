apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
    labels:
        holos.run/project: lending
    name: project-lending
    namespace: substrate-shim
spec:
    listeners:
        - allowedRoutes:
            kinds:
                - group: gateway.networking.k8s.io
                  kind: HTTPRoute
            namespaces:
                from: Selector
                selector:
                    matchExpressions:
                        - key: kubernetes.io/metadata.name
                          operator: In
                          values:
                            - ate-system
          hostname: '*.lending.ate.treasury.bank.internal'
          name: lending
          port: 443
          protocol: HTTPS
          tls:
            certificateRefs:
                - kind: Secret
                  name: lending-wildcard-tls
            mode: Terminate
    parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: ate
