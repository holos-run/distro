apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    labels:
        holos.run/project: lending
    name: ate-lending
    namespace: ate-system
spec:
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: project-lending
          namespace: substrate-shim
          sectionName: lending
    rules:
        - backendRefs:
            - name: atenet-router
              port: 443
