apiVersion: security.holos.run/v1alpha1
kind: ReferenceGrant
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
    labels:
        holos.run/project: lending
    name: project-lending
    namespace: keycloak
spec:
    from:
        - group: keycloak.holos.run
          kind: Group
          namespace: lending
        - group: keycloak.holos.run
          kind: User
          namespace: lending
        - group: keycloak.holos.run
          kind: GroupMembership
          namespace: lending
    to:
        - group: keycloak.holos.run
          kind: Instance
          name: default
