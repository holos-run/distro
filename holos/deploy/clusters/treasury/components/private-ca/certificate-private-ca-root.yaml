apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "1"
    name: private-ca-root
    namespace: cert-manager
spec:
    commonName: Bank of the Salish Sea treasury root CA
    duration: 87600h
    isCA: true
    issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: private-ca-bootstrap
    nameConstraints:
        critical: true
        excluded:
            ipRanges:
                - 0.0.0.0/0
                - ::/0
        permitted:
            dnsDomains:
                - treasury.bank.internal
                - svc
                - svc.cluster.local
    privateKey:
        algorithm: ECDSA
        rotationPolicy: Never
        size: 256
    secretName: private-ca-root
    subject:
        organizationalUnits:
            - treasury.bank.internal
        organizations:
            - Bank of the Salish Sea
