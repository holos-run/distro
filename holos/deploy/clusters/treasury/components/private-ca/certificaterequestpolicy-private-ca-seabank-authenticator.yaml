apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
    name: private-ca-seabank-authenticator
spec:
    allowed:
        dnsNames:
            required: true
            values:
                - k8s.treasury.bank.internal
        isCA: false
    selector:
        issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: private-ca
        namespace:
            matchNames:
                - seabank-authenticator
