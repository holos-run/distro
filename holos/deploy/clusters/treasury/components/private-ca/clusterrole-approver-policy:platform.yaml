apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: approver-policy:platform
rules:
    - apiGroups:
        - policy.cert-manager.io
      resourceNames:
        - private-ca-ate-system
        - private-ca-cnpg-system
        - private-ca-external-secrets
        - private-ca-holos-authenticator
        - private-ca-istio-ingress
        - private-ca-root
        - private-ca-substrate-shim
        - trust-manager-webhook
      resources:
        - certificaterequestpolicies
      verbs:
        - use
