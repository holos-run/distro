apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
    name: private-ca-external-secrets
spec:
    allowed:
        dnsNames:
            required: true
            values:
                - external-secrets-webhook.external-secrets.svc
        isCA: false
    selector:
        issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: private-ca
        namespace:
            matchNames:
                - external-secrets
