apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
    name: private-ca-substrate-shim
spec:
    allowed:
        dnsNames:
            required: true
            validations:
                - message: 'must be one of these exactly, * included: *.demo.ate.bank.internal, *.kagent.ate.bank.internal'
                  rule: self in ["*.demo.ate.bank.internal","*.kagent.ate.bank.internal"]
            values:
                - '*.demo.ate.bank.internal'
                - '*.kagent.ate.bank.internal'
        isCA: false
    selector:
        issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: private-ca
        namespace:
            matchNames:
                - substrate-shim
