apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "20"
    name: keycloak-operator
    namespace: argocd
spec:
    destination:
        server: https://kubernetes.default.svc
    project: platform
    source:
        path: holos/deploy/clusters/treasury/components/keycloak-operator
        repoURL: https://github.com/holos-run/distro.git
        targetRevision: main
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        retry:
            backoff:
                duration: 5s
                factor: 2
                maxDuration: 3m
            limit: 10
        syncOptions:
            - ServerSideApply=true
