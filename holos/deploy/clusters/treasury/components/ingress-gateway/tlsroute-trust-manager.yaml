apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
    name: trust-manager
    namespace: cert-manager
spec:
    hostnames:
        - trust-manager.cert-manager.webhooks.treasury.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: webhooks
    rules:
        - backendRefs:
            - name: trust-manager
              port: 443
