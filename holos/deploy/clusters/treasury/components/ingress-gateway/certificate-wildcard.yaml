apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: wildcard
    namespace: istio-ingress
spec:
    dnsNames:
        - '*.treasury.bank.internal'
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: private-ca
    privateKey:
        algorithm: ECDSA
        size: 256
    secretName: wildcard-tls
