apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
    name: cert-manager-approver-policy
    namespace: cert-manager
spec:
    hostnames:
        - cert-manager-approver-policy.cert-manager.svc
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: webhooks-cert-manager-approver-policy
    rules:
        - backendRefs:
            - name: cert-manager-approver-policy
              port: 443
