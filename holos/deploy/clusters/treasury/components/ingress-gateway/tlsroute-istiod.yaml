apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
    name: istiod
    namespace: istio-system
spec:
    hostnames:
        - istiod.istio-system.webhooks.treasury.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: webhooks
    rules:
        - backendRefs:
            - name: istiod
              port: 443
