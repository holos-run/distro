apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: argocd
    namespace: argocd
spec:
    hostnames:
        - argocd.bank.internal
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: https
    rules:
        - backendRefs:
            - name: argocd-server
              port: 80
