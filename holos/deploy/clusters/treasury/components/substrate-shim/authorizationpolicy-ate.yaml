apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
    name: ate
    namespace: substrate-shim
spec:
    action: ALLOW
    rules:
        - from:
            - source:
                requestPrincipals:
                    - https://keycloak.treasury.bank.internal/realms/default/*
          to:
            - operation:
                hosts:
                    - '*.demo.ate.treasury.bank.internal'
                    - '*.demo.ate.treasury.bank.internal:443'
          when:
            - key: request.auth.claims[groups]
              values:
                - /platform/owners
        - from:
            - source:
                requestPrincipals:
                    - https://keycloak.treasury.bank.internal/realms/default/*
          to:
            - operation:
                hosts:
                    - '*.kagent.ate.treasury.bank.internal'
                    - '*.kagent.ate.treasury.bank.internal:443'
          when:
            - key: request.auth.claims[groups]
              values:
                - /platform/owners
    targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ate
