apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: demo-wildcard
    namespace: substrate-shim
spec:
    dnsNames:
        - '*.demo.ate.bank.internal'
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: private-ca
    privateKey:
        algorithm: ECDSA
        size: 256
    secretName: demo-wildcard-tls
