apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
    name: ate
    namespace: substrate-shim
spec:
    hostnames:
        - '*.ate.bank.internal'
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: ingress
          namespace: istio-ingress
          sectionName: ate
    rules:
        - backendRefs:
            - name: ate-istio
              port: 443
