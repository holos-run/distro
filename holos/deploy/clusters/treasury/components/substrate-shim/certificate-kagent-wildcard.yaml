apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: kagent-wildcard
    namespace: substrate-shim
spec:
    dnsNames:
        - '*.kagent.ate.bank.internal'
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: private-ca
    privateKey:
        algorithm: ECDSA
        size: 256
    secretName: kagent-wildcard-tls
