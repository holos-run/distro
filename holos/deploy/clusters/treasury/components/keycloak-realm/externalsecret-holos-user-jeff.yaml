apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    name: holos-user-jeff
    namespace: keycloak
spec:
    dataFrom:
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: holos-user-jeff
    refreshPolicy: CreatedOnce
    target:
        creationPolicy: Orphan
        immutable: true
        name: holos-user-jeff
        template:
            data:
                password: '{{ .password }}'
                username: jeff
            engineVersion: v2
            mergePolicy: Replace
            type: kubernetes.io/basic-auth
