apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
    name: keycloak
    namespace: holos-controller
spec:
    provider:
        kubernetes:
            auth:
                serviceAccount:
                    name: keycloak-secret-reader
            remoteNamespace: keycloak
            server:
                caProvider:
                    key: ca.crt
                    name: kube-root-ca.crt
                    type: ConfigMap
