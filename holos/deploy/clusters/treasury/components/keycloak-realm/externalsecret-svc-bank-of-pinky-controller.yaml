apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    name: svc-bank-of-pinky-controller
    namespace: keycloak
spec:
    dataFrom:
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: svc-bank-of-pinky-controller
    refreshPolicy: CreatedOnce
    target:
        creationPolicy: Orphan
        immutable: true
        name: svc-bank-of-pinky-controller
        template:
            data:
                password: '{{ .password }}'
                username: svc-bank-of-pinky-controller
            engineVersion: v2
            mergePolicy: Replace
            type: kubernetes.io/basic-auth
