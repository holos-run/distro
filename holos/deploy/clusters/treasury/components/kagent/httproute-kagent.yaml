apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  hostnames:
  - kagent.bank.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ingress
    namespace: istio-ingress
    sectionName: https
  rules:
  - backendRefs:
    - name: kagent-oauth2-proxy
      port: 4180
