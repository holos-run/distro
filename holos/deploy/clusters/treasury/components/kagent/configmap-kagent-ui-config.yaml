apiVersion: v1
data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    error_log /dev/stderr;

    events {
        worker_connections 1024;
    }

    http {
        client_body_temp_path /tmp/nginx/client_temp;
        proxy_temp_path /tmp/nginx/proxy_temp;
        fastcgi_temp_path /tmp/nginx/fastcgi_temp;
        uwsgi_temp_path /tmp/nginx/uwsgi_temp;
        scgi_temp_path /tmp/nginx/scgi_temp;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        access_log /dev/stdout;

        client_max_body_size 20m;

        log_format main        '[$time_local] $remote_addr - $remote_user - $request $status $body_bytes_sent $http_referer $http_user_agent $http_x_forwarded_for';
        log_format upstreamlog '[$time_local] $remote_addr - $remote_user - $server_name $host to: $upstream_addr: $request $status upstream_response_time $upstream_response_time msec $msec request_time $request_time';

        upstream kagent_backend {
            server kagent-controller.kagent.svc.cluster.local:8083;
        }

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 8080;
            server_name localhost;

            root /usr/share/nginx/html;
            index index.html;

            # Drop ui.basePath when the proxy in front forwards it unstripped.

            location /health {
                return 200 'OK';
            }
            location = /env-config.js {
                alias /tmp/kagent/env-config.js;
                default_type application/javascript;
                add_header Cache-Control "no-store" always;
            }

            location = /.well-known/jwks.json {
                proxy_pass http://kagent_backend/.well-known/jwks.json;
                proxy_set_header Host $host;
            }

            location /a2a/ {
                proxy_pass http://kagent_backend/a2a/;
                proxy_http_version 1.1;
                proxy_set_header Connection '';
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Origin $scheme://$host;
                proxy_set_header x-auth-request-user "";
                proxy_set_header x-auth-request-email "";
                proxy_set_header x-auth-request-groups "";
                proxy_set_header x-auth-request-preferred-username "";
                proxy_set_header x-auth-request-access-token "";
                proxy_set_header x-auth-request-redirect "";
                proxy_set_header x-forwarded-user "";
                proxy_set_header x-forwarded-email "";
                proxy_set_header x-forwarded-groups "";
                proxy_set_header x-forwarded-preferred-username "";
                proxy_set_header x-agent-name "";
                proxy_set_header x-user-id "";
                proxy_read_timeout 1800s;
                proxy_send_timeout 1800s;
                # Chat is server-sent events; buffering would hold tokens back.
                proxy_buffering off;
            }

            location = /mcp {
                proxy_pass http://kagent_backend/mcp;
                proxy_http_version 1.1;
                proxy_set_header Connection '';
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header x-auth-request-user "";
                proxy_set_header x-auth-request-email "";
                proxy_set_header x-auth-request-groups "";
                proxy_set_header x-auth-request-preferred-username "";
                proxy_set_header x-auth-request-access-token "";
                proxy_set_header x-auth-request-redirect "";
                proxy_set_header x-forwarded-user "";
                proxy_set_header x-forwarded-email "";
                proxy_set_header x-forwarded-groups "";
                proxy_set_header x-forwarded-preferred-username "";
                proxy_set_header x-agent-name "";
                proxy_set_header x-user-id "";
                proxy_read_timeout 1800s;
                proxy_send_timeout 1800s;
                proxy_buffering off;
            }

            location /api/ {
                proxy_pass http://kagent_backend/api/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $server_name;
                proxy_set_header x-auth-request-user "";
                proxy_set_header x-auth-request-email "";
                proxy_set_header x-auth-request-groups "";
                proxy_set_header x-auth-request-preferred-username "";
                proxy_set_header x-auth-request-access-token "";
                proxy_set_header x-auth-request-redirect "";
                proxy_set_header x-forwarded-user "";
                proxy_set_header x-forwarded-email "";
                proxy_set_header x-forwarded-groups "";
                proxy_set_header x-forwarded-preferred-username "";
                proxy_set_header x-agent-name "";
                proxy_set_header x-user-id "";
                proxy_cache_bypass $http_upgrade;
                proxy_read_timeout 1800s;
                proxy_send_timeout 1800s;
                proxy_buffering off;
            }
            location = /mockServiceWorker.js {
                return 404;
            }

            # Vite fingerprints these filenames, so a given URL's bytes never change.
            location /assets/ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }

            # The bundle entrypoint must never be cached, or a client keeps loading
            # the previous release's asset URLs after an upgrade.
            location = /index.html {
                alias /tmp/kagent/index.html;
                add_header Cache-Control "no-store" always;
            }

            # SPA fallback: routing is client-side, so a deep link such as /agents
            # is not a file on disk and must still return the app shell.
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.0.0-holos.20261030.e1696d8
    helm.sh/chart: kagent-0.0.0-holos.20261030.e1696d8
  name: kagent-ui-config
  namespace: kagent
