apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.0.0-holos.20261030.e1696d8
    helm.sh/chart: kagent-0.0.0-holos.20261030.e1696d8
  name: kagent-ui
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent
  template:
    metadata:
      annotations:
        checksum/configmap: de64a257ff72c56ffd3fc2554ae6fef8d7b9c1b84f563df793f2ebe09617a74a
        checksum/ui-config: c966ef6b6a37ed6171dac505ab90be6581f64e58267aefe68f38b8b38c58c95f
      labels:
        app.kubernetes.io/component: ui
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: kagent-ui
        image: ghcr.io/holos-run/kagent/ui:0.0.0-holos.20261030.e1696d8@sha256:e4ed5be8ddec69fbc15d0a8f468255d2091f45314ae072bc40fd1c8b40335552
        imagePullPolicy: IfNotPresent
        name: ui
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 1
          periodSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/nginx/nginx.conf
          name: ui-config
          readOnly: true
          subPath: nginx.conf
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kagent-ui
      volumes:
      - emptyDir:
          sizeLimit: 50Mi
        name: tmp
      - configMap:
          name: kagent-ui-config
        name: ui-config
