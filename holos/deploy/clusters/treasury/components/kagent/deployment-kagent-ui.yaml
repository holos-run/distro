apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.0.0-holos.20261028.fa2cb23
    helm.sh/chart: kagent-0.0.0-holos.20261028.fa2cb23
  name: kagent-ui
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent
  template:
    metadata:
      annotations:
        checksum/configmap: c18321bebd4f86ad0af8fdc711190b6f2964374ffcc5b17873b257d277523f56
        checksum/ui-config: 7998c519439eef35cc26c1b7492388a55e1d146de979b16315481ba08b98ab44
      labels:
        app.kubernetes.io/component: ui
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: kagent-ui
        image: ghcr.io/holos-run/kagent/ui:0.0.0-holos.20261028.fa2cb23@sha256:36e29c6a21d607eb78e4e58383ed7515d59563dc939ae76fe29ce92f1a593514
        imagePullPolicy: IfNotPresent
        name: ui
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 1
          periodSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/nginx/nginx.conf
          name: ui-config
          readOnly: true
          subPath: nginx.conf
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kagent-ui
      volumes:
      - emptyDir:
          sizeLimit: 50Mi
        name: tmp
      - configMap:
          name: kagent-ui-config
        name: ui-config
