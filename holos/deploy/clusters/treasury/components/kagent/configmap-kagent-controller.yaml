apiVersion: v1
data:
  controller.yaml: |
    database:
      owner:
        role: kagent_owner
        urlFile: /etc/kagent/secrets/database-owner-url
      readWrite:
        role: kagent_readwrite
        urlFile: /etc/kagent/secrets/database-readwrite-url
      schema: kagent
      skipMigrations: false
      vectorEnabled: false
      vectorSchema: extensions
    gateway:
      publicUrl: http://kagent-controller.kagent.svc.cluster.local:8083
    harnessImages:
      claude: ghcr.io/kagent-dev/kagent/claude-harness:1.0.0-alpha17@sha256:69cbd021825de5b6798723c96a4ae72f78a4916e70e4f1cd7f6bd5678e6641ff
      codex: ghcr.io/kagent-dev/kagent/codex-harness:1.0.0-alpha17@sha256:1c8565efce78c420b6726c68eaf010363fafd4eeec0c1afcd317d9e517434c22
      kagent: ghcr.io/kagent-dev/kagent/golang-adk:1.0.0-alpha17@sha256:d20d411759d7bb549f00b7d6e8d669b91694aeb57dce847dcd2cbb68aa0d45f3
    kubernetes:
      namespace: kagent
      watchNamespaces:
      - kagent
    logging:
      level: info
    metrics:
      bindAddress: "0"
      secure: true
    push:
      allowHttp: false
      allowPrivateNetworks: false
      issuer: https://kagent.bank.internal
      maxConcurrency: 10
      recoveryInterval: 60s
      sendTimeout: 5s
    runtimeDefaults:
      builtinTools:
        bashVenvPath: ""
        disableAskUser: false
        disableBash: false
        disableFileSearch: false
      controlPlaneUrl: http://kagent-controller.kagent.svc.cluster.local:8083
      cpu: "1"
      gatewayUrl: http://kagent-controller.kagent.svc.cluster.local:8083
      logging:
        level: info
      memory: 1Gi
      telemetry: {}
    sandboxes:
      cpu: "1"
      defaultTtl: 3600s
      guestImage: ghcr.io/kagent-dev/kagent/sandbox-guest:1.0.0-alpha17@sha256:5355072effb219e157c3e0471637ca64d1f84ab7513dde23968c20cd65d18c9b
      maxTtl: 86400s
      memory: 1Gi
    server:
      auth:
        mode: trusted-proxy
        userIdClaim: email
      bindAddress: :8083
      grpcReflection: false
    sessions:
      idleTtl: 604800s
      shareMaxTtl: 0s
    substrate:
      actorJwtIssuer: https://idp.ate-system.svc
      apiEndpoint: dns:///api.ate-system.svc:443
      caFile: /run/substrate-servicedns/trust-bundle.pem
      clientCertFile: /run/substrate-podidentity/credential-bundle.pem
      routerUrl: https://atenet-router.ate-system.svc:443
    telemetry: {}
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.0.0-holos.20261030.e1696d8
    helm.sh/chart: kagent-0.0.0-holos.20261030.e1696d8
  name: kagent-controller
  namespace: kagent
