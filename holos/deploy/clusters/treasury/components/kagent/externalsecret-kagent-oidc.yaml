apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-oidc
  namespace: kagent
spec:
  data:
  - remoteRef:
      key: kagent-oidc-client
      property: client-secret
    secretKey: clientSecret
  - remoteRef:
      key: kagent-oauth2-proxy-cookie
      property: cookie-secret
    secretKey: cookieSecret
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kagent-oidc
  target:
    creationPolicy: Owner
    template:
      data:
        client-id: kagent
        client-secret: '{{ .clientSecret }}'
        cookie-secret: '{{ .cookieSecret }}'
      engineVersion: v2
      mergePolicy: Replace
