apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-db
  namespace: ate-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kagent
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
          app.kubernetes.io/instance: kagent
          app.kubernetes.io/name: kagent
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kagent-db-setup
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      cnpg.io/cluster: substrate-db
  policyTypes:
  - Ingress
