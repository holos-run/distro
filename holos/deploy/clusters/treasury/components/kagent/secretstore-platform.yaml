apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform
  namespace: kagent
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: kagent-platform-reader
      remoteNamespace: holos-prj-platform
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
