apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kagent-db-users
  namespace: kagent
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: kagent-kagent-db-users-reader
      remoteNamespace: ate-system
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
