apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-owner
  namespace: kagent
spec:
  data:
  - remoteRef:
      key: kagent-db-users
      property: kagent_owner_user
    secretKey: owner
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kagent-db-users
  target:
    creationPolicy: Owner
    template:
      data:
        ownerConnectionString: postgresql://kagent_owner_user:{{ .owner }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=verify-full&sslrootcert=/etc/private-ca/ca.crt
      engineVersion: v2
      mergePolicy: Replace
