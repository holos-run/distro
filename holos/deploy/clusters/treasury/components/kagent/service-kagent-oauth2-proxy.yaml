apiVersion: v1
kind: Service
metadata:
  labels:
    app: oauth2-proxy
    app.kubernetes.io/component: authentication-proxy
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: oauth2-proxy
    app.kubernetes.io/version: 7.15.5
    helm.sh/chart: oauth2-proxy-10.7.1
  name: kagent-oauth2-proxy
  namespace: kagent
spec:
  ports:
  - appProtocol: http
    name: http
    port: 4180
    protocol: TCP
    targetPort: http
  - appProtocol: http
    name: metrics
    port: 44180
    protocol: TCP
    targetPort: metrics
  selector:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/name: oauth2-proxy
  type: ClusterIP
