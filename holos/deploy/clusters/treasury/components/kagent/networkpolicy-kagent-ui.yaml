apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-ui
  namespace: kagent
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: kagent
          app.kubernetes.io/name: oauth2-proxy
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent
  policyTypes:
  - Ingress
