apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-anthropic
  namespace: kagent
spec:
  data:
  - remoteRef:
      key: anthropic-api-key
      property: ANTHROPIC_API_KEY
    secretKey: ANTHROPIC_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform
  target:
    creationPolicy: Owner
