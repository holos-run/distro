apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kagent-oidc
  namespace: kagent
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: kagent-kagent-oidc-reader
      remoteNamespace: kagent
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
