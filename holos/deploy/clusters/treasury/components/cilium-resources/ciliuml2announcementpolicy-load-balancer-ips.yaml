apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
    name: load-balancer-ips
spec:
    externalIPs: false
    interfaces:
        - ^eth0$
    loadBalancerIPs: true
    nodeSelector:
        matchExpressions:
            - key: holos.run/pod-network
              operator: NotIn
              values:
                - none
