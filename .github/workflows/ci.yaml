name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on force-pushed PR branches. Push events key the
# group by commit SHA so every merged commit on main gets a complete record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go
    # Where this job runs is the RUNNER_LABELS repository variable, a JSON
    # array of runner labels, and it MUST be set: there is no default. Unset,
    # it reaches fromJSON as an empty string and the run fails at once with
    # "Error when evaluating 'runs-on' for job 'go'", before any runner is
    # assigned. A silent default would put a new repository's jobs somewhere
    # nobody chose: on the garage, where a public repository's jobs queue
    # forever, or on hosted runners, which bill a private repository.
    #
    # For a new private repository, run it in the garage, the JIT runners on
    # runner.lan, with exactly the labels they register:
    #
    #   ["self-hosted","garage","proxmox"]
    #
    # All three are named because `garage` alone would also be satisfied by
    # any other org runner someone gives that label. The org's `garage`
    # runner group serves every private repository and no public one, so a
    # public repository uses ["ubuntu-latest"] instead, which is free there
    # and keeps fork pull requests off the garage LAN. A private repository
    # can switch to ["ubuntu-latest"] while the garage is down, a settings
    # change rather than a pull request whose own checks need the runner that
    # is down.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      # `runs-on` matches labels, not runner groups, so another org runner
      # carrying the same three labels could take this job. The garage
      # supervisor names every runner garage-<n>-<...>; fail loudly if the job
      # landed elsewhere while RUNNER_LABELS asked for the garage.
      - name: ran on the garage runner
        if: contains(vars.RUNNER_LABELS, 'garage')
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          case "${RUNNER_NAME}" in
            garage-*) ;;
            *) echo "::error::expected a garage-* runner, got ${RUNNER_NAME}"; exit 1 ;;
          esac

      # Pinned to full commit SHAs for supply-chain hardening, the same pins
      # aavis-ops uses on this runner.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # go-version-file reads the directive from go.mod, so the toolchain
      # follows the module rather than a version written here. The module has
      # no dependencies and so no go.sum for the module cache to key on.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: module path
        run: |
          got="$(go list -m)"
          if [ "${got}" != "go.holos.run/distro" ]; then
            echo "::error file=go.mod::module is ${got}, want go.holos.run/distro"
            exit 1
          fi
          go list ./...

      # The go.holos.run pages are what make the module path resolve. Each
      # must name the module path in go.mod, so a rename of either cannot
      # leave the other behind. The 404 page must equal the index page: the go
      # command resolves a subpath from the 404 page, re-fetches the prefix
      # from the index page, and fails if the two tags disagree.
      - name: go-import pages match go.mod
        run: |
          cmp sites/go.holos.run/distro/index.html sites/go.holos.run/distro/404.html
          want="<meta name=\"go-import\" content=\"$(go list -m) git "
          for page in sites/go.holos.run/distro/index.html sites/go.holos.run/distro/404.html; do
            if ! grep -qF "${want}" "${page}"; then
              echo "::error file=${page}::no go-import tag for $(go list -m)"
              exit 1
            fi
          done

      # holos/vendor/ holds git submodules, such as the Substrate fork, which
      # are other projects' code: gofmt skips them. This job checks out no
      # submodules (the Render job does), but a clone that has them must
      # pass too. go build and go
      # vet need no such rule: each submodule has its own go.mod, so ./...
      # stops at it.
      - name: gofmt
        run: |
          unformatted="$(find . -path ./holos/vendor -prune -o -name '*.go' -type f -exec gofmt -l {} +)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt -l reports unformatted files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

  render:
    name: Render
    # The rendered manifests in holos/deploy/ are what Argo CD syncs, and
    # they are committed beside the CUE that renders them. This job renders
    # the platform again from the commit, as README.md, Render, does by hand,
    # and fails if the result differs from what is committed, by a changed
    # file or a new one, so deploy/ can be trusted to be the render of the
    # CUE beside it, a ProjectClaim's included.
    #
    # It runs where the Go job runs; see that job's comments on
    # RUNNER_LABELS, which apply here unchanged.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    # A render takes seconds and the downloads a minute; anything near this
    # is a hung download or render, not a slow one.
    timeout-minutes: 15
    steps:
      - name: ran on the garage runner
        if: contains(vars.RUNNER_LABELS, 'garage')
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          case "${RUNNER_NAME}" in
            garage-*) ;;
            *) echo "::error::expected a garage-* runner, got ${RUNNER_NAME}"; exit 1 ;;
          esac

      # The substrate component renders from the Substrate fork's install
      # tree in the holos/vendor/substrate submodule, and checks that it is
      # at Substrate.commit, so the submodule is checked out. The job never
      # pushes, so the token is not left in the clone's git config.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
          persist-credentials: false

      # The tools the render runs, at the versions deploy/ is rendered with,
      # each checked against its published SHA-256: holos 0.106.0, which
      # runs helm for the charts and kubectl's kustomize for the patches,
      # and cue for `cue vet` and `cue cmd talos`. The runner's own helm and
      # kubectl, if it has any, could render a chart or a kustomization
      # differently, so these come first on PATH. Linux x86_64 only, which
      # the garage runners and ubuntu-latest are.
      - name: install holos, helm, kubectl and cue
        env:
          HOLOS_VERSION: "0.106.0"
          HOLOS_SHA256: 4a8de6339dc00df3321bf634fc1830cb4b22e83c4d8efc5deccd43c6d5611478
          HELM_VERSION: v3.17.3
          HELM_SHA256: ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd
          KUBECTL_VERSION: v1.37.1
          KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
          CUE_VERSION: v0.17.1
          CUE_SHA256: a39b0c97695069d95d276d99be0f5dbabb081d801bfdc9ba49b76efaf94e2369
        run: |
          if [ "${RUNNER_OS}/${RUNNER_ARCH}" != "Linux/X64" ]; then
            echo "::error::the pinned tools are linux amd64; this runner is ${RUNNER_OS}/${RUNNER_ARCH}"
            exit 1
          fi
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/dl"
          mkdir -p "${bin}" "${dl}"
          fetch() { # url sha256 file
            curl -fsSL --retry 3 -o "${dl}/$3" "$1"
            echo "$2  ${dl}/$3" | sha256sum -c -
          }
          fetch "https://github.com/holos-run/holos/releases/download/v${HOLOS_VERSION}/holos_Linux_x86_64.tar.gz" "${HOLOS_SHA256}" holos.tar.gz
          tar -xzf "${dl}/holos.tar.gz" -C "${bin}" holos
          fetch "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" "${HELM_SHA256}" helm.tar.gz
          tar -xzf "${dl}/helm.tar.gz" -C "${bin}" --strip-components=1 linux-amd64/helm
          fetch "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" "${KUBECTL_SHA256}" kubectl
          install -m 0755 "${dl}/kubectl" "${bin}/kubectl"
          fetch "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz" "${CUE_SHA256}" cue.tar.gz
          tar -xzf "${dl}/cue.tar.gz" -C "${bin}" cue
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: versions
        run: |
          holos --version
          helm version --short
          kubectl version --client
          cue version | head -1

      # README.md, Render. holos render platform writes files but never
      # removes one, so deploy/clusters goes first, and a file the CUE no
      # longer renders shows as deleted. cue vet comes first because the
      # render does not report every error in clusters.cue.
      - name: render
        working-directory: holos
        run: |
          cue vet ./...
          rm -rf deploy/clusters
          holos render platform
          cue cmd talos

      # Anything at all: a modified, deleted or untracked file, anywhere in
      # the repository, since cue cmd talos writes outside holos/.
      - name: deploy/ is the render
        run: |
          changes="$(git status --porcelain)"
          if [ -n "${changes}" ]; then
            echo "::error::the committed render differs from the CUE; render (holos/README.md, Render) and commit the result:"
            echo "${changes}"
            git diff --stat
            exit 1
          fi
