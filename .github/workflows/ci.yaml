name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on force-pushed PR branches. Push events key the
# group by commit SHA so every merged commit on main gets a complete record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go
    # Where this job runs is the RUNNER_LABELS repository variable, a JSON
    # array of runner labels, and it MUST be set: there is no default. Unset,
    # it reaches fromJSON as an empty string and the run fails at once with
    # "Error when evaluating 'runs-on' for job 'go'", before any runner is
    # assigned. A silent default would put a new repository's jobs somewhere
    # nobody chose: on the garage, where a public repository's jobs queue
    # forever, or on hosted runners, which bill a private repository.
    #
    # For a new private repository, run it in the garage, the JIT runners on
    # runner.lan, with exactly the labels they register:
    #
    #   ["self-hosted","garage","proxmox"]
    #
    # All three are named because `garage` alone would also be satisfied by
    # any other org runner someone gives that label. The org's `garage`
    # runner group serves every private repository and no public one, so a
    # public repository uses ["ubuntu-latest"] instead, which is free there
    # and keeps fork pull requests off the garage LAN. A private repository
    # can switch to ["ubuntu-latest"] while the garage is down, a settings
    # change rather than a pull request whose own checks need the runner that
    # is down.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      # `runs-on` matches labels, not runner groups, so another org runner
      # carrying the same three labels could take this job. The garage
      # supervisor names every runner garage-<n>-<...>; fail loudly if the job
      # landed elsewhere while RUNNER_LABELS asked for the garage.
      - name: ran on the garage runner
        if: contains(vars.RUNNER_LABELS, 'garage')
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          case "${RUNNER_NAME}" in
            garage-*) ;;
            *) echo "::error::expected a garage-* runner, got ${RUNNER_NAME}"; exit 1 ;;
          esac

      # Pinned to full commit SHAs for supply-chain hardening, the same pins
      # aavis-ops uses on this runner.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # go-version-file reads the directive from go.mod, so the toolchain
      # follows the module rather than a version written here. The module's
      # one dependency, go.yaml.in/yaml/v3 for contract-check, has none of its
      # own and downloads in a second, less than saving and restoring a cache
      # keyed on go.sum would take, so there is no module cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: module path
        run: |
          got="$(go list -m)"
          if [ "${got}" != "go.holos.run/distro" ]; then
            echo "::error file=go.mod::module is ${got}, want go.holos.run/distro"
            exit 1
          fi
          go list ./...

      # The go.holos.run pages are what make the module path resolve. Each
      # must name the module path in go.mod, so a rename of either cannot
      # leave the other behind. The 404 page must equal the index page: the go
      # command resolves a subpath from the 404 page, re-fetches the prefix
      # from the index page, and fails if the two tags disagree.
      - name: go-import pages match go.mod
        run: |
          cmp sites/go.holos.run/distro/index.html sites/go.holos.run/distro/404.html
          want="<meta name=\"go-import\" content=\"$(go list -m) git "
          for page in sites/go.holos.run/distro/index.html sites/go.holos.run/distro/404.html; do
            if ! grep -qF "${want}" "${page}"; then
              echo "::error file=${page}::no go-import tag for $(go list -m)"
              exit 1
            fi
          done

      # holos/vendor/ holds git submodules, such as the Substrate fork, which
      # are other projects' code: gofmt skips them. This job checks out no
      # submodules (the Render job does), but a clone that has them must
      # pass too. go build and go
      # vet need no such rule: each submodule has its own go.mod, so ./...
      # stops at it.
      - name: gofmt
        run: |
          unformatted="$(find . -path ./holos/vendor -prune -o -name '*.go' -type f -exec gofmt -l {} +)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt -l reports unformatted files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # The tests need nothing but the checkout and Go: the HTTP servers,
      # kubectl and talosctl they talk to are fakes in the tests, and
      # contract-check's test reads holos/deploy as committed, which the
      # Render job checks is the render. One is the exception and is skipped
      # here: holos/rendertest's TestClaimSandboxClass runs cue and holos
      # against the module, Substrate submodules included, which this job has
      # none of, so it runs only with RENDERTEST_TOOLS=1, which the Render job
      # sets (its rendertest step).
      - name: test
        run: go test ./...

  render:
    name: Render
    # The rendered manifests in holos/deploy/ are what Argo CD syncs, and
    # they are committed beside the CUE that renders them. This job renders
    # the platform again from the commit, as README.md, Render, does by hand,
    # and fails if the result differs from what is committed, by a changed
    # file or a new one, so deploy/ can be trusted to be the render of the
    # CUE beside it, a ProjectClaim's included.
    #
    # It runs where the Go job runs; see that job's comments on
    # RUNNER_LABELS, which apply here unchanged.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    # A render takes seconds and the downloads a minute; anything near this
    # is a hung download or render, not a slow one.
    timeout-minutes: 15
    steps:
      - name: ran on the garage runner
        if: contains(vars.RUNNER_LABELS, 'garage')
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          case "${RUNNER_NAME}" in
            garage-*) ;;
            *) echo "::error::expected a garage-* runner, got ${RUNNER_NAME}"; exit 1 ;;
          esac

      # The substrate component renders each cluster from the Substrate
      # fork's install tree at the commit the cluster pins, in the submodule
      # holos/vendor/substrate-<commit>, and checks that it is at it, so every
      # submodule is checked out. The job never
      # pushes, so the token is not left in the clone's git config.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
          persist-credentials: false

      # The tools the render runs, at the versions deploy/ is rendered with,
      # each checked against its published SHA-256: holos, which runs helm
      # for the charts and kubectl's kustomize for the patches, and cue for
      # `cue vet`. holos/tools.sh holds the versions and the checksums, and
      # is what a person runs in a clone (docs/getting-started.md), so the
      # pins are in one place. It installs into .tools/bin in the checkout,
      # which git ignores, and that directory goes first on PATH: the
      # runner's own helm and kubectl, if it has any, could render a chart
      # or a kustomization differently. It also checks out any submodule the
      # checkout step left out, which is none.
      - name: install holos, helm, kubectl and cue
        run: |
          holos/tools.sh
          holos/tools.sh bin >> "${GITHUB_PATH}"

      # contract-check is a Go program in this module, so the job needs the
      # Go job's toolchain too, set up the same way.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: versions
        run: |
          holos --version
          helm version --short
          kubectl version --client
          cue version | head -1
          go version

      # README.md, Render: holos/render.sh, which a person runs too. It
      # checks the tools are the pinned versions and the submodules are
      # checked out, then runs cue vet, because the render does not report
      # every error in clusters.cue or projects/, then removes
      # deploy/clusters, because holos render platform writes files but never
      # removes one, so a file the CUE no longer renders shows as deleted,
      # then renders.
      - name: render
        run: holos/render.sh

      # Anything at all: a modified, deleted or untracked file, anywhere in
      # the repository.
      - name: deploy/ is the render
        run: |
          changes="$(git status --porcelain)"
          if [ -n "${changes}" ]; then
            echo "::error::the committed render differs from the CUE; render (holos/README.md, Render) and commit the result:"
            echo "${changes}"
            git diff --stat
            exit 1
          fi

      # holos/rendertest's TestClaimSandboxClass, which needs cue, holos and
      # the Substrate submodules, all here and none in the Go job, which
      # skips it. RENDERTEST_TOOLS=1 runs it, and makes a missing tool or an
      # empty submodule a failure rather than a skip; -v puts its run in the
      # log. It checks that a claim asking for a sandbox class its cluster
      # does not run fails cue vet and the renders of its project and its
      # binding, with the claim, the class and the cluster in the message
      # (README.md, A claim's runtime). It runs on a copy of the module with
      # a claim and a binding of its own, which never reach deploy/.
      - name: rendertest
        env:
          RENDERTEST_TOOLS: "1"
        run: go test -count=1 -v -run TestClaimSandboxClass ./holos/rendertest

      # ADR 0003's Service contract, checked over the render just shown to be
      # the committed one: every webhook configuration, conversion webhook
      # and APIService names a Service by service:, the Service has a selector
      # and a cluster IP, and the pods behind it are off hostNetwork. A
      # configuration that cannot comply carries the
      # holos.run/contract-exception annotation and is listed in the log; one
      # whose reason names no ADR or Planboard item, or that complies anyway,
      # fails. README.md, Render, runs the same check by hand.
      - name: contract-check
        run: go run ./cmd/contract-check holos/deploy
