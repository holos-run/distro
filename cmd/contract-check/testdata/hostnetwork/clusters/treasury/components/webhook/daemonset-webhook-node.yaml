apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: webhook-node
  namespace: webhook
spec:
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
        version: v1
    spec:
      hostNetwork: true
      containers:
      - name: webhook
        image: example.com/webhook
