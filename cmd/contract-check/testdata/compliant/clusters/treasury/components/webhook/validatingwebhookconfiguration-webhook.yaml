apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: webhook
webhooks:
- name: validate.webhook.example.com
  clientConfig:
    service:
      namespace: webhook
      name: webhook
      path: /validate
- name: validate-more.webhook.example.com
  clientConfig:
    service:
      namespace: webhook
      name: webhook
      path: /validate-more
