apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: webhook
  annotations:
    holos.run/contract-exception: "ADR 0001's Gateway webhook path, kept on treasury until its rebuild; see ADR 0003 and Talos_Control_Plane_Ready/rebuild-treasury-on-the-new-layer"
webhooks:
- name: validate.webhook.example.com
  clientConfig:
    service:
      namespace: webhook
      name: webhook
      path: /validate
- name: validate-more.webhook.example.com
  clientConfig:
    service:
      namespace: webhook
      name: webhook
      path: /validate-more
