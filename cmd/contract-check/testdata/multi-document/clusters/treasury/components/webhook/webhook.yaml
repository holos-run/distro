---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: webhook
webhooks:
- name: validate.webhook.example.com
  clientConfig:
    service:
      namespace: webhook
      name: webhook
      path: /validate
- name: validate-more.webhook.example.com
  clientConfig:
    service:
      namespace: webhook
      name: webhook
      path: /validate-more
---
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: webhook
  namespace: webhook
spec: {}
---
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: webhook
spec:
  ports:
  - port: 443
    targetPort: 9443
  selector:
    app: webhook

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: webhook
spec:
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
        version: v1
    spec:
      containers:
      - name: webhook
        image: example.com/webhook
---
